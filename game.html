<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a14">
<title>爆量雷達 GAME</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Fira+Code:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* 遊戲版介面:跟 index.html 讀同一批 data/*.json,只是換一種看法。原版完全沒動,刪掉這個檔就還原。 */
:root{
  --bg:#070a14; --bg2:#0d1222; --card:#121933; --card2:#18213f; --line:#26305a; --line2:#34407a;
  --text:#eef2ff; --sec:#b4bde0; --muted:#8a93b8;
  /* 台股慣例:紅漲綠跌 */
  --up:#ff5a5f; --down:#2fd38a; --up-fill:rgba(255,90,95,.16); --down-fill:rgba(47,211,138,.16);
  --gold:#ffd23f; --cyan:#4de2ff; --violet:#a98bff; --orange:#ff9f43; --gray:#6c76a0;
  --num:"Fira Code",ui-monospace,Menlo,monospace;
  --pix:"Silkscreen","Fira Code",monospace;
  --r:14px; --tab-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.5;
  padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 16px);
  background-image:radial-gradient(circle at 50% -10%,rgba(77,226,255,.10),transparent 45%),linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:auto,100% 4px}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--sec)}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:8px}

/* ---------- HUD ---------- */
.hud{position:sticky;top:0;z-index:20;background:rgba(7,10,20,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hudrow{display:flex;align-items:center;gap:8px;padding:10px 0 6px}
.logo{font-family:var(--pix);font-weight:700;font-size:17px;letter-spacing:.5px;display:flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.logo .lt{color:var(--gold);text-shadow:0 0 10px rgba(255,210,63,.45)}
.logo small{font-size:10px;color:var(--cyan);border:1px solid var(--cyan);padding:1px 5px;border-radius:4px}
.sp{flex:1}
.pill{font-size:11.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;padding:4px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--sec);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--gray)}
.pill.live .dot{background:var(--up);box-shadow:0 0 8px var(--up);animation:blink 1.4s steps(2) infinite}
.pill.stale{border-color:var(--orange);color:var(--orange)}
.icobtn{min-width:44px;height:44px;border-radius:12px;border:1px solid var(--line2);background:var(--card);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;color:var(--sec);font-size:12px;gap:4px;padding:0 10px;white-space:nowrap;flex:none}
.icobtn:active{transform:scale(.96)}
.icobtn svg{width:18px;height:18px}
.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:.25}}

.hp{padding:2px 0 10px}
.hphd{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted)}
.hphd b{font-size:15px}
.hpbar{position:relative;height:14px;border-radius:4px;background:var(--bg2);border:2px solid var(--line2);margin-top:4px;overflow:hidden}
.hpbar .mid{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--line2)}
.hpbar .fill{position:absolute;top:0;bottom:0;background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.28) 0 2px,transparent 2px 8px)}
.hpft{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:3px}

/* ---------- 共用 ---------- */
.sec{margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.sec h2{margin:0;font-size:17px;font-weight:800;letter-spacing:.5px}
.sec .tag{font-family:var(--pix);font-size:10px;color:var(--bg);background:var(--cyan);padding:2px 6px;border-radius:4px}
.sec .tag.g{background:var(--gold)} .sec .tag.v{background:var(--violet)} .sec .tag.o{background:var(--orange)}
.sec small{color:var(--muted);font-size:12px;margin-left:auto}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px;position:relative}
.tap{cursor:pointer;transition:transform .12s ease,border-color .15s ease}
.tap:active{transform:scale(.985);border-color:var(--line2)}
.note{font-size:13px;color:var(--muted);line-height:1.6}
.banner{border-radius:var(--r);padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start;border:1px dashed var(--line2);background:rgba(169,139,255,.07);color:var(--sec)}
.banner svg{flex:none;width:22px;height:22px;color:var(--violet);margin-top:1px}
.banner b{color:var(--text)}
.empty{text-align:center;padding:18px 10px;color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:var(--r)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.stat .k{font-size:11.5px;color:var(--muted)}
.stat .v{font-family:var(--num);font-size:20px;font-weight:700;line-height:1.2;margin-top:2px}
.stat .v small{font-size:12px;color:var(--muted);font-weight:500}

/* 名字列 */
.nm{display:flex;align-items:center;gap:8px;min-width:0}
.nm b{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm .code{font-family:var(--num);font-size:12px;color:var(--muted)}
.row1{display:flex;justify-content:space-between;align-items:center;gap:10px}
.px{text-align:right;white-space:nowrap}
.px .p{font-family:var(--num);font-size:17px;font-weight:700}
.px .c{font-family:var(--num);font-size:13px;font-weight:600}

/* 行動標籤 */
.act{font-size:12.5px;font-weight:800;padding:2px 9px;border-radius:6px;letter-spacing:1px;white-space:nowrap}
.act.long{background:var(--up-fill);color:var(--up);border:1px solid rgba(255,90,95,.45)}
.act.short{background:var(--down-fill);color:var(--down);border:1px solid rgba(47,211,138,.45)}
.act.wait{background:rgba(108,118,160,.18);color:var(--sec);border:1px solid var(--line2)}

/* 評級徽章 */
.rank{position:absolute;top:-1px;right:-1px;font-family:var(--pix);font-weight:700;font-size:11px;padding:4px 9px 4px 10px;border-radius:0 var(--r) 0 10px;color:var(--bg)}
.rank.ok{background:var(--gold)} .rank.warn{background:var(--orange)} .rank.na{background:var(--gray);color:var(--text)} .rank.bad{background:#3a2440;color:#ff8fb1;border-left:1px solid #6a3a63;border-bottom:1px solid #6a3a63}
.card.ok{border-color:rgba(255,210,63,.55);box-shadow:0 0 0 1px rgba(255,210,63,.15),0 0 18px rgba(255,210,63,.08)}
.verdict{margin-top:8px;font-size:13.5px;line-height:1.5;padding:7px 10px;border-radius:10px;background:var(--bg2);border-left:3px solid var(--gray);color:var(--sec)}
.verdict.ok{border-color:var(--gold);color:var(--text)} .verdict.warn{border-color:var(--orange)} .verdict.bad{border-color:#ff8fb1;color:#ffc2d3}

/* 五關檢查 */
.checks{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
.ck{font-size:12px;padding:3px 7px;border-radius:7px;display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);color:var(--muted);background:var(--bg2)}
.ck i{width:14px;height:14px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:10px;font-weight:900;color:var(--bg)}
.ck.ok{color:var(--text)} .ck.ok i{background:var(--gold)}
.ck.warn{color:var(--orange);border-color:rgba(255,159,67,.4)} .ck.warn i{background:var(--orange)}
.ck.bad{color:#ff8fb1;border-color:rgba(255,143,177,.45)} .ck.bad i{background:#ff8fb1}
.ck.na i{background:var(--line2);color:var(--muted)}

/* 能量條(量能倍數) */
.energy{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.energy .seg{display:inline-flex;gap:2px}
.energy .seg i{width:8px;height:12px;border-radius:2px;background:var(--line)}
.energy .seg i.on{background:var(--gold);box-shadow:0 0 6px rgba(255,210,63,.5)}
.energy .seg i.on.hi{background:var(--orange)}
.energy .seg i.on.max{background:var(--up)}
.energy b{font-family:var(--num);color:var(--text)}

/* 戰場條:支撐 → 壓力 */
.field{margin-top:10px}
.fbar{position:relative;height:16px;border-radius:5px;background:var(--bg2);border:1px solid var(--line2);overflow:visible}
.fbar .z{position:absolute;top:0;bottom:0}
.fbar .me{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:5px;transform:rotate(45deg);border:3px solid var(--text);background:var(--bg);box-shadow:0 0 10px rgba(255,255,255,.35)}
.fbar .me.out{border-style:dashed}
.fft{display:flex;justify-content:space-between;font-size:12px;margin-top:5px;gap:6px}
.fft .mid{font-weight:700}
.fft .num{font-size:12.5px}

/* 旗標 */
.flag{font-size:11.5px;padding:1px 7px;border-radius:6px;margin-left:2px;white-space:nowrap;font-weight:700}
.flag.red{background:rgba(255,143,177,.15);color:#ff8fb1;border:1px solid rgba(255,143,177,.4)}
.flag.orange{background:rgba(255,159,67,.13);color:var(--orange);border:1px solid rgba(255,159,67,.4)}
.chips2{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}

/* 焦點卡 */
.fhead{display:flex;gap:10px;align-items:center}
.fic{width:40px;height:40px;flex:none;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px}
.fic.in{background:var(--up-fill);color:var(--up);border:1px solid rgba(255,90,95,.45)}
.fic.out{background:var(--down-fill);color:var(--down);border:1px solid rgba(47,211,138,.45)}
.fic.flat{background:rgba(108,118,160,.18);color:var(--sec);border:1px solid var(--line2)}
.fbody{flex:1;min-width:0}
.meta2{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:6px;font-size:13px;color:var(--sec)}
.vb{font-weight:800;font-size:13px}

/* ---------- 自選:地圖 ---------- */
.search{position:relative;margin-top:14px}
.search input{width:100%;height:48px;border-radius:12px;border:1px solid var(--line2);background:var(--card);color:var(--text);font-size:16px;padding:0 14px 0 42px}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:13px;top:14px;width:20px;height:20px;color:var(--muted)}
.filters{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:var(--card);color:var(--sec);font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.fchip b{font-family:var(--num);font-size:12px;color:var(--muted)}
.fchip.on{background:var(--cyan);border-color:var(--cyan);color:var(--bg);font-weight:800}
.fchip.on b{color:var(--bg)}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(20px,1fr));gap:4px;margin-top:10px}
.map i{aspect-ratio:1;border-radius:4px;cursor:pointer;border:1px solid transparent}
.map i.hot{border-color:var(--gold);box-shadow:0 0 6px rgba(255,210,63,.45)}
.maplg{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:6px}
.stk{padding:11px 12px}
.stk .st{font-size:12px;font-weight:800;padding:1px 8px;border-radius:6px;white-space:nowrap}
.st.breakout{background:var(--up-fill);color:var(--up)} .st.breakdown{background:var(--down-fill);color:var(--down)}
.st.nearRes{background:rgba(255,159,67,.14);color:var(--orange)} .st.nearSup{background:rgba(77,226,255,.12);color:var(--cyan)}
.st.mid{background:rgba(108,118,160,.15);color:var(--muted)}

/* ---------- 情報 ---------- */
.idx{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.idx .t{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.idx .n{font-size:12.5px;color:var(--muted)}
.idx .v{font-family:var(--num);font-size:18px;font-weight:700}
.idx .c{font-family:var(--num);font-size:13px}
.list .li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);min-height:48px;cursor:pointer}
.list .li:last-child{border-bottom:0}
.list .li .l{display:flex;align-items:center;gap:8px;min-width:0}
.list .li .r{text-align:right;font-family:var(--num);font-size:14px;white-space:nowrap}
.medal{width:26px;height:26px;flex:none;border-radius:7px;background:var(--bg2);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-family:var(--pix);font-size:11px;color:var(--muted)}
.medal.m1{background:var(--gold);color:var(--bg);border-color:var(--gold)} .medal.m2{background:#c9d2f0;color:var(--bg)} .medal.m3{background:#e0a46e;color:var(--bg)}
.bul{margin:0;padding:0;list-style:none}
.bul li{position:relative;padding:7px 0 7px 18px;font-size:14px;color:var(--sec);line-height:1.6;border-bottom:1px dashed var(--line)}
.bul li:last-child{border-bottom:0}
.bul li:before{content:"";position:absolute;left:2px;top:15px;width:7px;height:7px;background:var(--cyan);transform:rotate(45deg)}
.hl{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:7px 0;border-bottom:1px dashed var(--line)}
.hl:last-child{border-bottom:0}
.hl .s{width:10px;height:10px;border-radius:3px;flex:none}
.hl .s.ok{background:var(--down)} .hl .s.bad{background:var(--up)}
.hl span.d{color:var(--muted);font-size:12.5px;margin-left:auto;text-align:right}
.seg2{display:flex;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:3px;margin-bottom:10px}
.seg2 button{flex:1;min-height:40px;border:0;border-radius:9px;background:transparent;color:var(--sec);font-size:14px;cursor:pointer}
.seg2 button.on{background:var(--card2);color:var(--text);font-weight:800;box-shadow:inset 0 0 0 1px var(--line2)}


/* ---------- 戰鬥畫面 ---------- */
.player{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;margin-top:12px}
.pbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.pbox .k{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:4px}
.pbox .v{font-family:var(--num);font-size:18px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hpline{height:8px;border-radius:3px;background:var(--bg2);border:1px solid var(--line2);margin-top:4px;overflow:hidden}
.hpline i{display:block;height:100%;background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.25) 0 2px,transparent 2px 6px)}
.ammo{display:flex;gap:3px;margin-top:5px}
.ammo i{width:9px;height:14px;border-radius:2px 2px 1px 1px;background:var(--line)}
.ammo i.on{background:var(--gold);box-shadow:0 0 5px rgba(255,210,63,.55)}
.light{margin-top:14px;border-radius:22px;padding:22px 16px 18px;text-align:center;position:relative;overflow:hidden;border:2px solid var(--line2);background:var(--card)}
.light .big{font-size:72px;font-weight:900;line-height:1;letter-spacing:6px;margin:6px 0 4px}
.light .orb{width:88px;height:88px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:40px}
.light .why{font-size:15.5px;color:var(--text);margin-top:8px;line-height:1.55}
.light .sub{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.5}
.light.go{border-color:#3ce07f;background:radial-gradient(circle at 50% 0%,rgba(60,224,127,.22),var(--card) 70%)}
.light.go .big{color:#3ce07f;text-shadow:0 0 22px rgba(60,224,127,.6)} .light.go .orb{background:#3ce07f;box-shadow:0 0 34px rgba(60,224,127,.8);animation:pulse 1.2s ease-in-out infinite}
.light.wait{border-color:var(--gold);background:radial-gradient(circle at 50% 0%,rgba(255,210,63,.16),var(--card) 70%)}
.light.wait .big{color:var(--gold);text-shadow:0 0 18px rgba(255,210,63,.45)} .light.wait .orb{background:var(--gold);box-shadow:0 0 26px rgba(255,210,63,.6)}
.light.stop{border-color:#ff5a5f;background:radial-gradient(circle at 50% 0%,rgba(255,90,95,.18),var(--card) 70%)}
.light.stop .big{color:#ff5a5f;text-shadow:0 0 18px rgba(255,90,95,.5)} .light.stop .orb{background:#ff5a5f;box-shadow:0 0 26px rgba(255,90,95,.65)}
@keyframes pulse{50%{transform:scale(1.08)}}
.phase{display:flex;gap:4px;margin-top:14px}
.phase span{flex:1;font-size:11px;text-align:center;padding:5px 2px;border-radius:7px;background:var(--bg2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.phase span.on{background:var(--cyan);color:var(--bg);font-weight:800;border-color:var(--cyan)}
.phase span.done{opacity:.45}
.tg{display:flex;gap:12px;align-items:center}
.tg .badge2{width:64px;height:64px;flex:none;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:22px;line-height:1.1}
.tg .badge2 small{font-size:10.5px;font-weight:700;opacity:.85}
.b-go{background:rgba(60,224,127,.18);color:#3ce07f;border:2px solid #3ce07f}
.b-try{background:rgba(77,226,255,.14);color:var(--cyan);border:2px solid var(--cyan)}
.b-care{background:rgba(255,159,67,.14);color:var(--orange);border:2px solid var(--orange)}
.b-no{background:rgba(255,90,95,.12);color:#ff8fb1;border:2px solid #ff8fb1}
.b-look{background:rgba(108,118,160,.18);color:var(--sec);border:2px solid var(--line2)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.trio > div{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center}
.trio .k{font-size:11px;color:var(--muted)} .trio .v{font-family:var(--num);font-size:16px;font-weight:700}
.tip{font-size:13px;color:var(--sec);margin-top:8px;line-height:1.5}
.logrow{display:flex;gap:8px;margin-top:8px}
.logrow input{flex:1;min-width:0;height:48px;border-radius:12px;border:1px solid var(--line2);background:var(--bg2);color:var(--text);font-size:17px;padding:0 12px;font-family:var(--num)}
.logrow button{min-width:72px;height:48px;border-radius:12px;border:0;font-weight:900;font-size:16px;cursor:pointer}
.logrow .win{background:var(--up);color:#fff} .logrow .lose{background:var(--down);color:var(--bg)}
details.more{margin-top:18px;border:1px solid var(--line);border-radius:var(--r);padding:4px 12px;background:rgba(18,25,51,.5)}
details.more summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--sec);font-size:14px;font-weight:700}
/* ---------- 底部導覽 ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(10,14,28,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:var(--tab-h)}
.tabs button{border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:12px;position:relative}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--gold)}

<script>
// =====================================================================================
// 計算邏輯直接沿用 index.html(支撐壓力、分區、交易小組檢查都是同一套),只換顯示方式。
// =====================================================================================
let INTRADAY = null, HISTORY = null, CHIP = null, MARKET = null, REVIEW = null, HEALTH = null;
let CUR = null, TAB = 'quest', FILTER = 'key', SEARCH = '', INTEL_RANK = 'live';

const num = n => { if(n === null || n === undefined || n === '') return null; const v = Number(n); return Number.isFinite(v) ? v : null; };
const cls = p => { const v = num(p); return v > 0 ? 'up' : (v < 0 ? 'down' : 'flat'); };
const fmtPct = p => { const v = num(p); return v === null ? '-' : (v > 0 ? '+' : '') + v.toFixed(2) + '%'; };
const fmtNum = n => { const v = num(n); return v === null ? '-' : (Number.isInteger(v) ? String(v) : v.toFixed(2)); };
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp1 = x => Math.max(-1, Math.min(1, x));
const tw = iso => iso ? new Date(iso).toLocaleTimeString('zh-TW', {timeZone:'Asia/Taipei', hour:'2-digit', minute:'2-digit', hour12:false}) : '';

function tickOf(code, p){
  if(!code || String(code).includes(':')) return 0;
  if(/^00/.test(String(code))) return p < 50 ? 0.01 : 0.05;
  return p < 10 ? 0.01 : p < 50 ? 0.05 : p < 100 ? 0.1 : p < 500 ? 0.5 : p < 1000 ? 1 : 5;
}
function toTick(p, code){ const v = num(p); if(v === null) return p; const t = tickOf(code, v); if(!t) return v; return Math.round(Math.round(v / t) * t * 100) / 100; }
function roundTick(code, p, mode){
  const t = tickOf(code, p) || 0.01, f = mode === 'up' ? Math.ceil : Math.floor;
  return Math.round(f(p / t - 1e-9 * (mode === 'up' ? 1 : -1)) * t * 100) / 100;
}
const DT_FEE = 0.1425 * 0.6 / 100, DT_TAX = 0.15 / 100;

// ---- 支撐壓力(同 index.html keyLevels / effectiveLevels,讀同一個 lvBasis 設定) ----
let BASIS = 'auto';
try { const s = localStorage.getItem('lvBasis'); if(s) BASIS = s; } catch(e) {}
function swOk(sw, n){ if(!sw || sw['h' + n] == null || sw['l' + n] == null) return false; return n === 5 ? sw.d5 >= 3 : sw['d' + n] >= n; }
function keyLevels(q){
  const cdp = q.cdp, sw = q.swing;
  const hasCdp = !!(cdp && cdp.nh != null && cdp.nl != null && cdp.cdp != null);
  const cdpLow = hasCdp && cdp.reliability === 'low';
  let mode = BASIS;
  if(mode === 'cdp' && !hasCdp) mode = 'auto';
  if((mode === '5' || mode === '10' || mode === '20') && !swOk(sw, +mode)) mode = 'auto';
  if(mode === 'auto') mode = (hasCdp && !cdpLow) ? 'cdp' : (swOk(sw, 5) ? '5' : (hasCdp ? 'cdp' : 'today'));
  let resTarget, supTarget, resBase, supBase;
  if(mode === 'cdp'){ resTarget = cdp.nh; supTarget = cdp.nl; resBase = 'CDP近高'; supBase = 'CDP近低'; }
  else if(mode === 'today'){ resTarget = q.high ?? q.upper_limit; supTarget = q.low ?? q.lower_limit; resBase = '今日高'; supBase = '今日低'; }
  else { const n = +mode, d = sw['d' + n]; resTarget = sw['h' + n]; supTarget = sw['l' + n]; resBase = `近${d}日高`; supBase = `近${d}日低`; }
  resTarget = toTick(resTarget, q.code); supTarget = toTick(supTarget, q.code);
  if(resTarget != null && q.upper_limit != null) resTarget = Math.min(resTarget, q.upper_limit);
  if(supTarget != null && q.lower_limit != null) supTarget = Math.max(supTarget, q.lower_limit);
  const midVal = toTick(hasCdp ? cdp.cdp : q.prev_close, q.code);
  const hitUpper = q.upper_limit != null && resTarget != null && resTarget >= q.upper_limit - 0.005;
  const hitLower = q.lower_limit != null && supTarget != null && supTarget <= q.lower_limit + 0.005;
  return {resTarget, resLabel: hitUpper ? '漲停' : resBase, supTarget, supLabel: hitLower ? '跌停' : supBase,
    midVal, midLabel: hasCdp ? 'CDP樞紐' : '昨收', basis: mode === 'cdp' ? 'cdp' : (mode === 'today' ? 'today' : 'swing')};
}
function effectiveLevels(q){
  const dp = (t, b) => (t != null && b) ? ((t - b) / b * 100) : null;
  let {resTarget, resLabel, supTarget, supLabel, midVal, midLabel} = keyLevels(q);
  let dRes = dp(resTarget, q.last), dSup = dp(q.last, supTarget), brokeNote = '';
  const cf = q.conf;
  if(cf && ((dRes !== null && dRes < 0) || (dSup !== null && dSup < 0))){
    const nm = x => (x.srcs || []).join('+') + (x.n >= 2 ? '★' : '');
    const nr = (cf.res || [])[0], ns = (cf.sup || [])[0];
    brokeNote = dRes < 0 ? `已突破 ${resLabel} ${fmtNum(resTarget)},改看上下最近的線` : `已跌破 ${supLabel} ${fmtNum(supTarget)},改看上下最近的線`;
    if(nr){ resTarget = toTick(nr.price, q.code); resLabel = nm(nr); dRes = dp(resTarget, q.last); }
    if(ns){ supTarget = toTick(ns.price, q.code); supLabel = nm(ns); dSup = dp(q.last, supTarget); }
  }
  return {resTarget, resLabel, supTarget, supLabel, midVal, midLabel, dRes, dSup, brokeNote};
}
function lvInfo(q){
  const last = num(q.last);
  if(last === null || last <= 0) return null;
  const kl = keyLevels(q), res = kl.resTarget, sup = kl.supTarget;
  if(res == null || sup == null || res <= sup) return null;
  const dRes = (res - last) / last * 100, dSup = (last - sup) / last * 100;
  const adr = q.swing && q.swing.adr5;
  const near = adr ? Math.min(3, Math.max(0.6, adr * 0.25)) : 1.5;
  let state = 'mid';
  if(kl.basis !== 'today'){
    if(dRes < 0) state = 'breakout'; else if(dSup < 0) state = 'breakdown';
    else if(dRes <= near && dRes <= dSup) state = 'nearRes'; else if(dSup <= near) state = 'nearSup';
  }
  return {res, sup, dRes, dSup, state, near};
}
const ST_TXT = {breakout:'突破壓力', breakdown:'跌破支撐', nearRes:'接近壓力', nearSup:'接近支撐', mid:'區間中'};
function isKey(q, lv){
  const p = num(q.pace) || 0, ff = INTRADAY && INTRADAY.focus_first;
  return p >= 2.5 || !!(ff && ff[q.code]) || (p >= 1.5 && !!lv && lv.state !== 'mid');
}

// ---- 分區(做多區/平衡區/做空區),同 index.html zoneInfo ----
const ZONE_BAND_PCT = 0.15;
function approxVwap(code){
  if(!HISTORY || !HISTORY.points) return null;
  let pv = 0, vv = 0, pp = null, pvol = 0;
  for(const p of HISTORY.points){
    const last = p.wl && p.wl[code], vol = p.wlv && p.wlv[code];
    if(num(last) === null || num(vol) === null || vol < pvol) continue;
    const ref = pp === null ? last : (pp + last) / 2;
    pv += (vol - pvol) * ref; vv += vol - pvol; pp = last; pvol = vol;
  }
  return vv > 0 ? pv / vv : null;
}
function zoneInfo(q){
  const {resTarget, supTarget, midVal} = effectiveLevels(q);
  const bi = ((INTRADAY && INTRADAY.bias && INTRADAY.bias.items) || []).find(x => x.code === q.code && x.vwap != null);
  const vwap = bi ? bi.vwap : (approxVwap(q.code) ?? midVal);
  if(resTarget == null || supTarget == null || vwap == null || !(resTarget > supTarget)) return null;
  const vwapOut = !(vwap > supTarget && vwap < resTarget);
  const c = vwapOut ? (supTarget + resTarget) / 2 : vwap;
  const bandLo = Math.max(supTarget, c * (1 - ZONE_BAND_PCT / 100)), bandHi = Math.min(resTarget, c * (1 + ZONE_BAND_PCT / 100));
  const last = q.last;
  let zone = null, label = '';
  if(num(last) !== null){
    if(last > resTarget){ zone = 'over'; label = '已突破壓力'; }
    else if(last < supTarget){ zone = 'under'; label = '已跌破支撐'; }
    else if(last > bandHi){ zone = 'short'; label = '做空區'; }
    else if(last < bandLo){ zone = 'long'; label = '做多區'; }
    else { zone = 'mid'; label = '平衡區'; }
  }
  return {res: resTarget, sup: supTarget, vwap, bandLo, bandHi, zone, label};
}
const ZONE_C = {short:'var(--up)', over:'var(--up)', long:'var(--down)', under:'var(--down)', mid:'var(--violet)'};
function fieldBar(q){
  const z = zoneInfo(q);
  if(!z) return '';
  const span = z.res - z.sup, pos = v => Math.max(0, Math.min(100, (v - z.sup) / span * 100));
  const a = pos(z.bandLo), b = pos(z.bandHi), dot = pos(q.last), out = z.zone === 'over' || z.zone === 'under';
  return `<div class="field"><div class="fbar">
      <span class="z" style="left:0;width:${a}%;background:var(--down-fill);border-radius:4px 0 0 4px"></span>
      <span class="z" style="left:${a}%;width:${Math.max(1.5, b - a)}%;background:rgba(169,139,255,.28)"></span>
      <span class="z" style="left:${b}%;width:${100 - b}%;background:var(--up-fill);border-radius:0 4px 4px 0"></span>
      <span class="me${out ? ' out' : ''}" style="left:${dot}%;border-color:${ZONE_C[z.zone] || 'var(--text)'}"></span></div>
    <div class="fft"><span class="down">支撐 <span class="num">${fmtNum(z.sup)}</span></span><span class="mid" style="color:${ZONE_C[z.zone]}">${z.label}</span><span class="up">壓力 <span class="num">${fmtNum(z.res)}</span></span></div></div>`;
}

// ---- 能量條:量能倍數(和原版🔥同樣門檻 1.5/2.5/4/6/8) ----
function energy(p){
  const v = num(p);
  if(v === null) return '<span class="energy">量能累積中</span>';
  const n = [1.5, 2.5, 4, 6, 8].filter(t => v >= t).length;
  const seg = [0,1,2,3,4].map(i => `<i class="${i < n ? 'on' + (i >= 4 ? ' max' : i >= 2 ? ' hi' : '') : ''}"></i>`).join('');
  return `<span class="energy" title="量能 ${v.toFixed(1)} 倍"><span class="seg">${seg}</span><b>${v.toFixed(1)}x</b></span>`;
}

function flagBadges(q){
  const f = q && q.flags; if(!f) return '';
  const md = d => d ? d.slice(5).replace('-', '/') : '';
  const o = [];
  if(f.disposal) o.push(`<span class="flag red">處置中 到${md(f.disposal.end)}</span>`);
  if(f.daytrade === false) o.push('<span class="flag red">不可當沖</span>');
  if(f.no_sell_first) o.push('<span class="flag orange">暫停先賣</span>');
  if(f.change_trading) o.push('<span class="flag red">分盤交易</span>');
  if(f.notice) o.push('<span class="flag orange">注意股</span>');
  if(f.near_disposal) o.push('<span class="flag orange">可能處置</span>');
  return o.join('');
}

// ---- 市場情緒 + 交易小組(同 index.html marketMood / teamCheck) ----
function marketMood(it){
  if(!it || !it.indices) return null;
  const ix = c => it.indices.find(x => x.code === c) || {};
  const tse = ix('TWS:TSE01:INDEX'), otc = ix('TWS:OTC01:INDEX'), txf = ix('TWF:TXF:FUTURES');
  const qs = (it.watchlist_quotes || []).filter(q => !String(q.code).startsWith('00') && num(q.pct) !== null);
  if(num(tse.pct) === null || !qs.length) return null;
  const up = qs.filter(q => q.pct > 0).length, dn = qs.filter(q => q.pct < 0).length;
  const parts = [
    {k:'加權', w:25, v:clamp1(tse.pct / 1.5), t:fmtPct(tse.pct)},
    {k:'開盤後', w:20, v:num(tse.open) ? clamp1((tse.last / tse.open - 1) * 100 / 0.8) : 0, t:num(tse.open) ? fmtPct((tse.last / tse.open - 1) * 100) : '-'},
    {k:'自選漲跌', w:25, v:(up - dn) / qs.length, t:`${up}漲/${dn}跌`},
    {k:'櫃買', w:15, v:num(otc.pct) !== null ? clamp1(otc.pct / 1.5) : 0, t:num(otc.pct) !== null ? fmtPct(otc.pct) : '-'},
    {k:'期現價差', w:15, v:(num(txf.last) !== null && tse.last) ? clamp1((txf.last - tse.last) / tse.last * 100 / 0.5) : 0, t:(num(txf.last) !== null && tse.last) ? `${txf.last - tse.last > 0 ? '+' : ''}${Math.round(txf.last - tse.last)}點` : '-'},
  ];
  const score = Math.round(parts.reduce((a, p) => a + p.w * p.v, 0));
  const hot = qs.filter(q => num(q.pace) !== null && q.pace >= 3).length / qs.length;
  return {score, label: score >= 30 ? '偏多' : score <= -30 ? '偏空' : '中性', side: score >= 30 ? 1 : score <= -30 ? -1 : 0, parts, hot, overheated: hot >= 0.15, up, dn, n: qs.length};
}
function zoneOf(q){ try { return zoneInfo(q); } catch(e){ return null; } }
function teamCheck(q, mood){
  const p = num(q.last);
  if(p === null) return null;
  const B = (INTRADAY && INTRADAY.bias && INTRADAY.bias.items) || [];
  const fresh = B.filter(x => x.code === q.code && x.fresh);
  // 方向:有剛觸發的多空判斷就用它;同時有方向相反的觸發(例如分數放空和超跌反向做多同一根成立)時,
  // 只有通過回測的那一邊算數,都沒通過就當成矛盾、改看漲跌幅(±0.5% 以內算觀望)
  const fSides = new Set(fresh.map(x => x.side)), held = fresh.filter(x => x.holds);
  const conflict = fSides.size > 1;
  const pick = !conflict ? fresh : (new Set(held.map(x => x.side)).size === 1 ? held : []);
  let side = pick.length ? (pick[0].side === 'long' ? 1 : -1) : (num(q.pct) >= 0.5 ? 1 : num(q.pct) <= -0.5 ? -1 : 0);
  const S = side > 0 ? '做多' : side < 0 ? '做空' : '觀望';
  const ck = [];
  const pace = num(q.pace);
  ck.push({r:'機會', s: pace >= 2 ? 'ok' : 'na', t: pace === null ? '量能資料累積中' : pace >= 2 ? `量能 ${pace.toFixed(1)} 倍,有資金在動` : `量能 ${pace.toFixed(1)} 倍,不算突出`});
  if(conflict && !pick.length) ck[ck.length - 1] = {r: '機會', s: 'warn', t: ck[ck.length - 1].t + ',而且剛觸發的多空訊號互相矛盾'};
  const nw = q.news || [];
  ck.push({r:'消息', s: nw.length ? 'warn' : 'ok', t: nw.length ? `${nw[0].date.slice(5)} ${nw[0].cat}:${nw[0].title.slice(0, 28)}${nw[0].title.length > 28 ? '…' : ''}(事件可能放大波動)` : '近兩天沒有重大訊息'});
  if(!mood || !side) ck.push({r:'情緒', s:'na', t: mood ? `大盤${mood.label}(${mood.score > 0 ? '+' : ''}${mood.score})` : '沒有大盤資料'});
  else ck.push({r:'情緒', s: mood.side === side ? 'ok' : mood.side === -side ? 'warn' : 'na', t: `大盤${mood.label}(${mood.score > 0 ? '+' : ''}${mood.score})` + (mood.side === -side ? ',方向和個股相反' : mood.side === side ? ',方向一致' : '') + (mood.overheated ? ',爆量家數偏多、市場過熱' : '')});
  const {resTarget, supTarget} = effectiveLevels(q);
  const zi = zoneOf(q);
  if(!side || num(resTarget) === null || num(supTarget) === null) ck.push({r:'圖表', s:'na', t:'方向不明或沒有支撐壓力'});
  else {
    const risk = side > 0 ? p - supTarget : resTarget - p, reward = side > 0 ? resTarget - p : p - supTarget;
    const rr = risk > 0 ? reward / risk : null;
    const chase = zi && ((side > 0 && (zi.zone === 'short' || zi.zone === 'over')) || (side < 0 && (zi.zone === 'long' || zi.zone === 'under')));
    const minRR = riskCfg().minRR;
    ck.push({r:'圖表', s: rr === null ? 'bad' : (rr >= minRR && !chase ? 'ok' : (rr < 1 || chase ? 'warn' : 'na')), t: rr === null ? '已越過停損位置' : `損益比 ${rr.toFixed(1)}:1` + (rr < minRR ? `(低於你設定的 ${minRR})` : '') + (zi ? `,現價在${zi.label}` : '') + (chase ? '(追價位置)' : '')});
  }
  const f = q.flags || {};
  const adr = q.swing && num(q.swing.adr5), hi = num(q.high), lo = num(q.low), pc = num(q.prev_close);
  const used = adr && hi !== null && lo !== null && pc ? (hi - lo) / pc * 100 / adr : null;
  const stopPct = side && num(side > 0 ? supTarget : resTarget) !== null ? Math.abs(p - (side > 0 ? supTarget : resTarget)) / p * 100 : null;
  const rs = riskState();
  if(rs.block) ck.push({r:'風險', s:'bad', t:'今日風控:' + rs.reasons.join('、')});
  else if(f.disposal || f.daytrade === false || f.change_trading) ck.push({r:'風險', s:'bad', t: f.disposal ? `處置中(${f.disposal.measure || '分盤撮合'})` : f.daytrade === false ? '不能現股當沖' : '分盤交易'});
  else if(side < 0 && f.no_sell_first) ck.push({r:'風險', s:'bad', t:'暫停先賣後買,不能當沖做空'});
  else {
    const w = [], ul = num(q.upper_limit), ll = num(q.lower_limit);
    if(side > 0 && ul && p >= ul * 0.99) w.push('貼近漲停,很難再往上、也可能買不到');
    if(side < 0 && ll && p <= ll * 1.01) w.push('貼近跌停,很難再往下、也可能賣不到');
    if(f.notice || f.near_disposal) w.push(f.near_disposal ? '可能被處置' : '注意股');
    if(used !== null && used >= 1.5) w.push(`振幅已達平常 ${Math.round(used * 100)}%`);
    if(stopPct !== null && stopPct > 3) w.push(`停損距離 ${stopPct.toFixed(1)}% 偏遠`);
    if(stopPct !== null && stopPct < 0.5) w.push(`停損只差 ${stopPct.toFixed(2)}%,很容易被正常波動洗掉`);
    ck.push({r:'風險', s: w.length ? 'warn' : 'ok', t: w.length ? w.join('、') : '沒有交易限制,振幅與停損距離正常'});
  }
  const bad = ck.filter(c => c.s === 'bad').length, warn = ck.filter(c => c.s === 'warn').length, ok = ck.filter(c => c.s === 'ok').length;
  const validated = pick.some(x => x.holds && (x.side === 'long' ? 1 : -1) === side);
  let v, vc;
  if(bad){ v = '拒絕:' + ck.filter(c => c.s === 'bad').map(c => c.t).join('、'); vc = 'bad'; }
  else if(!side){ v = '觀望:方向不明'; vc = 'na'; }
  else if(validated && ok >= 3 && warn <= 1){ v = `符合已驗證規則(${pick.find(x => x.holds).rule_name}),可依部位試算執行`; vc = 'ok'; }
  else if(warn >= 2){ v = '不建議:警示項目太多,就算要做也要縮小部位'; vc = 'warn'; }
  else { v = validated ? '已驗證規則觸發,但條件不夠完整:縮小部位' : '僅觀察:沒有回測站得住的規則觸發,只適合紙上交易'; vc = validated ? 'warn' : 'na'; }
  return {side, S, ck, v, vc};
}

function renderFocusSec(it){

// ================= 戰鬥畫面:衝 / 等 / 停 =================
// 規則跟經典版一樣,只是用號誌燈說出來:
//   衝 = 回測站得住的規則剛觸發、交易小組五關沒有警示(決策 ok);目前規則都還沒過關,所以通常不會出現。
//   等 = 盤中可以交易,但沒有可以衝的;可以拿「練習」目標做紙上交易。
//   停 = 休市/收盤、開盤前 15 分鐘(開盤區間還沒形成)、過了最晚進場時間、今日風控到上限、資料延遲。
// 今日風控設定與今天的損益存在 localStorage,和經典版「今日風控」同一份(dt_risk_cfg / dt_day / dt_capital / dt_risk)。
const RISK_DEF = {maxLoss: 5000, maxTrades: 5, lastEntry: '12:30', minRR: 1.5};
let RISK_IGNORE_TIME = false;   // 收工/休市回顧當天目標時,不套用「過了最晚進場」
const tpNow = () => { if(window.__NOW) return window.__NOW;   // 測試用:可以指定時間
  const d = new Date(Date.now() + 8 * 3600000); return {date: d.toISOString().slice(0, 10), hm: d.toISOString().slice(11, 16), wd: d.getUTCDay()}; };
function riskCfg(){ try { return Object.assign({}, RISK_DEF, JSON.parse(localStorage.getItem('dt_risk_cfg') || '{}')); } catch(e){ return Object.assign({}, RISK_DEF); } }
function riskDay(){ const t = tpNow().date; try { const d = JSON.parse(localStorage.getItem('dt_day') || '{}'); return d.date === t ? d : {date: t, pnl: 0, trades: 0}; } catch(e){ return {date: t, pnl: 0, trades: 0}; } }
function riskState(){
  const c = riskCfg(), d = riskDay(), now = tpNow().hm;
  const remain = c.maxLoss + Math.min(0, d.pnl), reasons = [];

function planOf(q, t){
  // 進場 = 現價;停損 = 支撐(做多)/壓力(做空);停利 = 另一邊;股數 = 每筆最多虧 ÷ 停損距離(不超過今天剩下的額度)
  const p = num(q.last), L = effectiveLevels(q);
  if(!t || !t.side || p === null) return null;
  const stop = t.side > 0 ? L.supTarget : L.resTarget, target = t.side > 0 ? L.resTarget : L.supTarget;
  if(num(stop) === null || num(target) === null) return null;
  const dist = t.side > 0 ? p - stop : stop - p;
  if(!(dist > 0)) return null;
  let cap = 100, rk = 1;
  try { cap = +(localStorage.getItem('dt_capital') || 100); rk = +(localStorage.getItem('dt_risk') || 1); } catch(e){}
  const budget = Math.min(cap * 10000 * rk / 100, riskState().remain);

    <div class="note" style="margin-top:6px">實際累積結果,不是理論值,也不保證之後一樣。</div>` : '';

  // 復盤
  const rv = REVIEW && REVIEW.days && REVIEW.days[REVIEW.latest];
  document.getElementById('reviewSec').innerHTML = rv && rv.summary ? `<div class="sec"><h2>收盤復盤</h2><span class="tag">REPLAY</span><small>${esc(rv.date)}</small></div><div class="card"><ul class="bul">${rv.summary.map(s => `<li>${esc(s)}</li>`).join('')}</ul></div>` : '';

  // 健康檢查
  const h = HEALTH;
  document.getElementById('healthSec').innerHTML = h && h.items ? `<div class="sec"><h2>系統狀態</h2><span class="tag ${h.ok ? '' : 'o'}">${h.ok ? 'ALL OK' : 'CHECK'}</span><small>${tw(h.checked_at)}</small></div><div class="card">${h.items.map(x => `<div class="hl"><span class="s ${x.ok ? 'ok' : 'bad'}"></span><b>${esc(x.name)}</b><span class="d">${esc(x.detail)}</span></div>`).join('')}</div>` : '';
}

// ---- 個股面板 ----
function findQ(code){ return ((INTRADAY && INTRADAY.watchlist_quotes) || []).find(q => q.code === code); }
function openSheet(code, silent){
  const q = findQ(code);
  if(!q) return;
  CUR = code;
  const L = effectiveLevels(q), p = num(q.last);
  const t = teamCheck(q, marketMood(INTRADAY));
  const dp = (a, b) => (a != null && b) ? (a - b) / b * 100 : null;
  // 階梯:壓力 / 現價 / 交界 / 支撐,依價格高低排
  const rungs = [
    {k:'res', ic:'▲', name:`壓力・${L.resLabel}`, v:L.resTarget, d: dp(L.resTarget, p)},
    {k:'mid', ic:'●', name:`交界・${L.midLabel}`, v:L.midVal, d: dp(L.midVal, p)},
    {k:'sup', ic:'▼', name:`支撐・${L.supLabel}`, v:L.supTarget, d: dp(L.supTarget, p)},
    {k:'now', ic:'◆', name:'現價', v:p, d:null},
  ].filter(r => num(r.v) !== null).sort((a, b) => b.v - a.v);
  const ladder = rungs.map(r => `<div class="lv ${r.k}"><span class="ic">${r.ic}</span><div class="t"><div>${esc(r.name)}</div>${r.d !== null ? `<div>距現價 ${r.d > 0 ? '+' : ''}${r.d.toFixed(2)}%</div>` : '<div>你在這裡</div>'}</div><span class="v">${fmtNum(r.v)}</span></div>`).join('');
  const rr = (L.dRes > 0 && L.dSup > 0) ? `<div class="rr"><div class="rrbar"><i style="width:${L.dSup / (L.dRes + L.dSup) * 100}%;background:var(--down)"></i><i style="width:${L.dRes / (L.dRes + L.dSup) * 100}%;background:var(--up)"></i></div><div class="rrft"><span class="down">下行 −${L.dSup.toFixed(1)}%</span><b>損益比 ${(L.dRes / L.dSup).toFixed(1)} : 1</b><span class="up">上行 +${L.dRes.toFixed(1)}%</span></div></div>` : '';

  // 振幅進度與損益兩平
  let amp = '';
  const adr = q.swing && num(q.swing.adr5), hi = num(q.high), lo = num(q.low), pc = num(q.prev_close);
  if(adr && hi !== null && lo !== null && pc){
    const today = (hi - lo) / pc * 100, ratio = today / adr, w = Math.min(100, ratio * 50);
    const c = ratio >= 1.5 ? 'var(--up)' : ratio >= 1 ? 'var(--gold)' : 'var(--cyan)';
    amp = `<div class="kv" style="border:0;padding-bottom:0"><span>今日振幅 / 平常</span><b class="num">${today.toFixed(2)}% / ${adr.toFixed(2)}%</b></div>
      <div class="prog"><i style="width:${w}%;background-color:${c}"></i><em></em></div>
      <div class="note" style="margin-top:4px">已走 <b style="color:${c}">${Math.round(ratio * 100)}%</b>・${ratio >= 1.5 ? '超過平常 1.5 倍,追價空間有限' : ratio >= 1 ? '已走完平常一天的振幅' : '還沒走完平常一天的振幅'}(中線 = 平常)</div>`;
  }
  let be = '';
  if(p){
    const bl = roundTick(q.code, p * (1 + DT_FEE) / (1 - DT_FEE - DT_TAX), 'up');
    const bs = roundTick(q.code, p * (1 - DT_FEE - DT_TAX) / (1 + DT_FEE), 'down');
    be = `<div class="kv"><span>做多要賣在</span><b class="num up">${fmtNum(bl)} 以上</b></div><div class="kv"><span>做空要買回在</span><b class="num down">${fmtNum(bs)} 以下</b></div><div class="note">以現價 ${fmtNum(p)} 進場的損益兩平價,來回成本約 ${((2 * DT_FEE + DT_TAX) * 100).toFixed(2)}%(手續費 6 折、當沖稅減半)</div>`;
  }
  const news = (q.news || []).slice(0, 3);
  document.getElementById('sheetIn').innerHTML = `
    <div class="grab"><div class="bar"></div>
      <div class="shead"><div><div class="nm"><b>${esc(q.name)}</b><span class="code">${esc(q.code)}</span></div>
        <div class="bigp ${cls(q.pct)}">${fmtNum(p)}</div><div class="bigc ${cls(q.pct)}">${q.change > 0 ? '+' : ''}${fmtNum(q.change)}(${fmtPct(q.pct)})</div></div>
        <button class="icobtn close" onclick="closeSheet()" aria-label="關閉"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
      <div class="meta2">${energy(q.pace)}${flagBadges(q)}${t ? actTag(t.S) : ''}</div>
    </div>
    ${t ? `<div class="box" style="${t.vc === 'ok' ? 'border-color:var(--gold)' : ''}"><h3>交易小組評級 <span class="tag" style="background:${{ok:'var(--gold)', warn:'var(--orange)', na:'var(--gray)', bad:'#ff8fb1'}[t.vc]}">${RANK[t.vc]}</span></h3>
      ${t.ck.map(c => `<div class="ckrow"><span class="ck ${c.s}"><i>${CK_I[c.s]}</i>${c.r}</span><span>${esc(c.t)}</span></div>`).join('')}
      <div class="verdict ${t.vc}"><b>結論</b> ${esc(t.v)}</div></div>` : ''}
    <div class="box"><h3>戰場位置 <span class="tag">MAP</span></h3>${fieldBar(q) || '<div class="note">沒有支撐壓力資料</div>'}</div>
    <div class="box"><h3>支撐壓力階梯 <span class="tag">LV</span></h3><div class="ladder">${ladder}</div>${rr}${L.brokeNote ? `<div class="note" style="margin-top:8px">${esc(L.brokeNote)}</div>` : ''}</div>
    <div class="box"><h3>當沖工具 <span class="tag">TOOL</span></h3>${amp}${be}</div>
    <div class="box"><h3>今日數據</h3>
      <div class="kv"><span>開 / 高 / 低</span><b class="num">${fmtNum(q.open)} / ${fmtNum(q.high)} / ${fmtNum(q.low)}</b></div>
      <div class="kv"><span>昨收</span><b class="num">${fmtNum(q.prev_close)}</b></div>
      <div class="kv"><span>漲停 / 跌停</span><b class="num"><span class="up">${fmtNum(q.upper_limit)}</span> / <span class="down">${fmtNum(q.lower_limit)}</span></b></div>
      <div class="kv"><span>成交量</span><b class="num">${num(q.volume) !== null ? Math.round(q.volume).toLocaleString('en-US') + ' 張' : '-'}</b></div>
    </div>
    ${news.length ? `<div class="box"><h3>重大訊息</h3>${news.map(n => `<div class="kv"><span>${esc(n.date.slice(5))} ${esc(n.cat)}</span><span style="text-align:right">${esc(n.title)}</span></div>`).join('')}</div>` : ''}
    <div class="btnrow"><a class="btn" href="https://www.google.com/search?tbm=nws&q=${encodeURIComponent(q.name + ' ' + q.code)}" target="_blank" rel="noopener">查新聞</a><a class="btn pri" href="index.html">經典版看完整</a></div>
    <div class="disc">依網頁已有資料機械式檢查與計算,判斷邏輯跟經典版相同,不是預測,也不構成買賣建議。</div>`;
  if(!silent){
    document.body.classList.add('sheet-open');
    document.getElementById('sheet').scrollTop = 0;
    try { history.pushState({sheet: code}, '', '#' + code); } catch(e) {}
  }
}
function closeSheet(fromPop){
  if(!document.body.classList.contains('sheet-open')) return;
  document.body.classList.remove('sheet-open');
  CUR = null;
  if(!fromPop) try { history.back(); } catch(e) {}
}
window.addEventListener('popstate', () => closeSheet(true));
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeSheet(); });

// ---- 分頁 ----
function setTab(t){
  TAB = t; document.body.dataset.tab = t;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  window.scrollTo({top: 0});
}
document.getElementById('q').addEventListener('input', e => { SEARCH = e.target.value; renderList(INTRADAY); });

// ---- 載入(同 index.html 的資料檔,60 秒自動刷新,失敗保留上次資料) ----
let SLOW_AT = 0;
async function getJson(u){ const r = await fetch(u, {cache:'no-store'}); if(!r.ok) throw new Error(r.status); return r.json(); }
async function loadAll(opts){
  opts = opts || {};
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spin');
  const errs = [];
  try { INTRADAY = await getJson('data/intraday_latest.json'); } catch(e){ errs.push('即時報價讀取失敗'); }
  try { HISTORY = await getJson('data/intraday_history.json'); } catch(e){}
  try { MARKET = await getJson('data/market_scan.json'); } catch(e){}
  if(!opts.silent || Date.now() - SLOW_AT > 600000){
    SLOW_AT = Date.now();
    try { CHIP = await getJson('data/latest.json'); } catch(e){}
    try { REVIEW = await getJson('data/review.json'); } catch(e){}
    try { HEALTH = await getJson('data/health.json'); } catch(e){}
  }
  const safe = (n, f) => { try { f(); } catch(e){ console.error('render ' + n, e); } };
  safe('hud', () => renderHud(INTRADAY));
  safe('battle', () => renderBattle(INTRADAY));
  safe('stats', () => renderStats(INTRADAY));
  safe('bias', () => renderBiasSec(INTRADAY));
  safe('team', () => renderTeamSec(INTRADAY));
  safe('focus', () => renderFocusSec(INTRADAY));
  safe('flags', () => renderFlagSec(INTRADAY));
  safe('map', () => renderMap(INTRADAY));
  safe('intel', () => renderIntel());
  if(CUR) safe('sheet', () => openSheet(CUR, true));
  if(errs.length && !INTRADAY) document.getElementById('battle').innerHTML = `<div class="err">${errs.join('、')},請按右上角重新整理</div>`;
  btn.classList.remove('spin');
}
setTab('quest');
loadAll();
setInterval(() => { if(!document.hidden) loadAll({silent: true}); }, 60000);
</script>
</body>
