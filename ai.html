<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Trader</title>
<!-- 爆量雷達的「AI 決策」版面:資料全部來自同一個 repo 的 data/*.json(和 index.html、game.html 共用),不下單、不連任何券商 -->
<style>
:root{
  --bg:#f6f7f4; --panel:#ffffff; --side:#f9faf7; --line:#e6e8e1; --line2:#eef0ea;
  --text:#1f2421; --muted:#7b827c; --faint:#a3a9a3;
  --accent:#3a9a6c; --accent-bg:#e6f3ec; --accent-ink:#22734c;
  --up:#d8453b; --down:#2f9a5a; --gold:#b98a2c; --gold-bg:#f7efdc; --warn:#b26a00;
  --chip:#f0f2ed; --shadow:0 1px 2px rgba(20,30,20,.04),0 4px 14px rgba(20,30,20,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121513; --panel:#1a1e1b; --side:#161a17; --line:#2a302b; --line2:#232825;
    --text:#e4e8e4; --muted:#8e968f; --faint:#6a716b;
    --accent:#4fbf8a; --accent-bg:#1f3529; --accent-ink:#7fd8ac;
    --up:#ff6b5e; --down:#4cc77e; --gold:#d9ad55; --gold-bg:#3a3020; --warn:#e0a040;
    --chip:#232825; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#121513; --panel:#1a1e1b; --side:#161a17; --line:#2a302b; --line2:#232825;
  --text:#e4e8e4; --muted:#8e968f; --faint:#6a716b;
  --accent:#4fbf8a; --accent-bg:#1f3529; --accent-ink:#7fd8ac;
  --up:#ff6b5e; --down:#4cc77e; --gold:#d9ad55; --gold-bg:#3a3020; --warn:#e0a040;
  --chip:#232825; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}
.num,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
a{color:inherit}
.app{display:flex;min-height:100vh}
/* ---- 側欄 ---- */
.side{width:220px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:20px 18px 18px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center}
.logo i{width:13px;height:13px;border:2px solid #fff;border-radius:4px}
.brand b{display:block;font-size:13px;letter-spacing:.04em}
.brand span{font-size:11px;color:var(--muted)}
.nav{padding:6px 10px;display:flex;flex-direction:column;gap:2px}
.nav button,.nav a{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:var(--muted);font-size:13.5px;position:relative}
.nav button:hover,.nav a:hover{background:var(--chip);color:var(--text)}
.nav button.on{background:var(--accent-bg);color:var(--accent-ink);font-weight:600}
.nav button.on::before{content:"";position:absolute;left:-10px;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--accent)}
.nav svg{width:16px;height:16px;flex:none}
.nav .sep{height:1px;background:var(--line);margin:10px 12px}
.sys{margin-top:auto;border-top:1px solid var(--line);padding:14px 18px 18px;font-size:12px}
.sys .cap{font-size:10px;letter-spacing:.12em;color:var(--faint);font-weight:600;margin-bottom:6px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--faint);margin-right:6px;vertical-align:1px}
.dot.ok{background:var(--accent)} .dot.warn{background:var(--warn)}
.sys .tz{color:var(--muted);font-family:ui-monospace,Menlo,monospace;font-size:11px;margin-top:2px}
/* ---- 主畫面 ---- */
main{flex:1;min-width:0;padding:22px 32px 48px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:10px 14px;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--accent);font-weight:700}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
h1{font-size:24px;margin:2px 0 4px;letter-spacing:.01em}
.sub{color:var(--muted);font-size:13px;margin:0}
.btn{all:unset;cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 16px;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:16px}
.card h3{font-size:13px;margin:0;padding:14px 18px;border-bottom:1px solid var(--line2);font-weight:600}
.card h3 small{color:var(--muted);font-weight:400;margin-left:6px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding:16px}
.kpi{display:flex;gap:12px;align-items:center;padding:6px 8px;min-width:0}
.kpi .ic{width:38px;height:38px;border-radius:10px;background:var(--accent-bg);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.kpi .ic.gold{background:var(--gold-bg);color:var(--gold)}
.kpi .ic svg{width:17px;height:17px}
.kpi .lb{font-size:10.5px;color:var(--muted);letter-spacing:.06em;white-space:nowrap}
.kpi .v{font-size:20px;font-weight:650;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v.sm{font-size:15px}
.kpi .s{font-size:11px;color:var(--muted);white-space:nowrap}
.up{color:var(--up)} .down{color:var(--down)} .mut{color:var(--muted)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;color:var(--muted);font-weight:500;text-align:left;padding:10px 16px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--line2);vertical-align:top;white-space:nowrap}
tr:last-child td{border-bottom:0}
th.r,td.r{text-align:right}
td.code{font-weight:650;white-space:nowrap}
td.code span{display:block;font-weight:400;color:var(--muted);font-size:12px}
td.why{color:var(--muted);font-size:12.5px;min-width:240px;max-width:520px;white-space:normal}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;background:var(--chip);color:var(--muted);white-space:nowrap}
.chip.green{background:var(--accent-bg);color:var(--accent-ink)}
.chip.long{background:color-mix(in srgb,var(--up) 12%,transparent);color:var(--up)}
.chip.short{background:color-mix(in srgb,var(--down) 14%,transparent);color:var(--down)}
.chip.gold{background:var(--gold-bg);color:var(--gold)}
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line2)}
.filters button{all:unset;cursor:pointer;padding:4px 12px;border-radius:999px;font-size:12.5px;background:var(--chip);color:var(--muted)}
.filters button.on{background:var(--accent);color:#fff}
.empty{padding:28px 18px;text-align:center;color:var(--muted);font-size:13px}
.note{font-size:12px;color:var(--muted);margin:8px 2px 0;line-height:1.7}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.grid2>*{min-width:0}
.list{padding:6px 0}
.row{display:flex;gap:12px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line2)}
.row:last-child{border-bottom:0}
.row .t{font-family:ui-monospace,Menlo,monospace;color:var(--muted);font-size:12px;width:42px;flex:none}
.row .m{flex:1;min-width:0}
.row .m b{font-weight:650}
.row .m div{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.amt input{width:110px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 8px;font:inherit;font-family:ui-monospace,Menlo,monospace}
.more{display:block;width:100%;text-align:center;padding:12px;color:var(--accent-ink);font-size:13px;cursor:pointer;border:0;background:none;border-top:1px solid var(--line2)}
.bar{height:6px;border-radius:3px;background:var(--chip);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.chip.red{background:color-mix(in srgb,var(--up) 14%,transparent);color:var(--up)}
.gauge{position:relative;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--down),var(--chip) 50%,var(--up))}
.gauge em{position:absolute;top:-4px;width:4px;height:16px;border-radius:2px;background:var(--text);transform:translateX(-2px)}
.picks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.picks .card{margin:0}
.pick.faded{opacity:.62}
.ph{display:flex;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.pc{font-size:15px;margin-right:4px}
.obs{padding:8px 18px}
.ob{display:grid;grid-template-columns:20px 76px 1fr;gap:8px;align-items:start;padding:5px 0;font-size:12.5px}
.ob.dec{border-top:1px dashed var(--line);margin-top:4px;padding-top:8px}
.ob .on{color:var(--muted);white-space:nowrap}
.ob .ot{min-width:0}
.om{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--chip);color:var(--muted)}
.om.ok{background:var(--accent-bg);color:var(--accent-ink)} .om.warn{background:var(--gold-bg);color:var(--gold)}
.om.bad{background:color-mix(in srgb,var(--up) 15%,transparent);color:var(--up)}
.pf{padding:10px 18px 14px;border-top:1px solid var(--line2);font-size:12.5px;color:var(--muted);line-height:1.8}
.pf b{color:var(--text)}
.hist{margin-top:4px;font-size:12px;display:flex;flex-wrap:wrap;gap:2px 6px;align-items:center}
.hist i{font-style:normal;color:var(--faint)}
.breadth{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--chip)}
.breadth i{display:block;height:100%} .breadth .bu{background:var(--up)} .breadth .bd{background:var(--down)} .breadth .bf{background:var(--faint)}
.grid2.eq{grid-template-columns:1fr 1fr;align-items:start}
.crow{display:grid;grid-template-columns:1fr 70px 1.2fr;gap:8px;padding:8px 18px;border-bottom:1px solid var(--line2);font-size:13px;align-items:center}
.crow:last-child{border-bottom:0} .crow .cr-top{font-size:12px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow{border-bottom:1px solid var(--line2)} .prow:last-child{border-bottom:0}
.prow summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:46px 1fr auto;gap:4px 10px;padding:10px 16px;align-items:center}
.prow summary::-webkit-details-marker{display:none}
.prow[open] summary{background:var(--chip)}
.ps{font-size:16px;font-weight:700;text-align:center}
.pn{min-width:0} .pn b{font-weight:650} .pn div{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv{grid-column:2 / 4;display:flex;gap:3px}
.om.sm{width:17px;height:17px;font-size:10px;border-radius:5px}
.pd{padding:8px 16px 14px;font-size:12.5px}
.warnc{color:var(--gold)}
.theme{all:unset;cursor:pointer;color:var(--muted);font-size:12px;margin-top:8px}
@media (max-width:1100px){ .kpis{grid-template-columns:repeat(3,minmax(0,1fr))} .grid2,.picks{grid-template-columns:1fr} }
@media (max-width:900px){ .grid2.eq{grid-template-columns:1fr} }
@media (max-width:760px){
  .app{display:block}
  .side{position:sticky;top:0;z-index:5;width:auto;height:auto;flex-direction:row;align-items:center;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .brand{padding:10px 12px}
  .brand div{display:none}
  .nav{flex-direction:row;padding:6px 6px 6px 0}
  .nav button,.nav a{padding:7px 10px;white-space:nowrap;font-size:13px}
  .nav button.on::before,.nav .sep{display:none}
  .nav a.ext{display:none}
  .sys{display:none}
  main{padding:16px 16px 40px}
  h1{font-size:20px}
  .head{flex-wrap:wrap}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));padding:10px}
  .kpi{padding:6px 4px;gap:9px}
  .kpi .ic{width:32px;height:32px}
  .kpi .v{font-size:17px}
  th,td{padding:10px 12px}
  .hm{display:none}
  td.why{min-width:200px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo"><i></i></div><div><b>AI TRADER</b><span>台股・當沖決策</span></div></div>
    <nav class="nav" id="nav">
      <button data-v="radar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12 18 6"/></svg>盤中雷達</button>
      <button data-v="picks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 3 2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg>自選股推薦</button>
      <button data-v="journal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h11l3 3v13H5z"/><path d="M9 10h6M9 14h6M9 18h3"/></svg>我的交易</button>
      <div class="sep"></div>
      <button data-v="ai"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>規則觸發紀錄</button>
      <button data-v="team"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M15 14.5c3 0 5.5 2 5.5 5.5"/></svg>觀測員成績</button>
      <button data-v="rules"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12a9 9 0 1 1-9-9v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>規則驗證</button>
      <div class="sep"></div>
      <a class="ext" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>市場分析(經典版)</a>
      <a class="ext" href="game.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>遊戲版</a>
    </nav>
    <div class="sys">
      <div class="cap">SYSTEM</div>
      <div id="sysState"><span class="dot"></span>讀取中</div>
      <div class="tz" id="sysTime">Asia/Taipei</div>
      <button class="theme" id="themeBtn">切換深淺色</button>
    </div>
  </aside>
  <main id="main"></main>
</div>
<script>
// ---------- 資料 ----------
let BACKFILL = null, INTRA = null, LOG = null, DT = null, OVN = null, TIDX = null, TDAY = {}, PDATE = null, RADAR = null, MIDX = null, MDAY = {}, JOURNAL = null, TSRC = 'market', VIEW = 'radar', TAB = 'card', FILTER = 'all', SHOW = 30;
const RULE_TYPE = { score: '多空分數', pb: '拉回均價線', fade: '超漲超跌反向' };
const EXIT = { stop: '停損', target: '停利', close: '收盤出場' };
const AMT_KEY = 'aitrader.amount', TH_KEY = 'aitrader.theme';
const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} } };
let AMOUNT = Number(store.get(AMT_KEY)) || 100000;

async function getJson(p){ const r = await fetch(p, {cache: 'no-store'}); if(!r.ok) throw new Error(p); return r.json(); }
async function loadAll(){
  const [a, b, c, d] = await Promise.allSettled([getJson('data/intraday_latest.json'), getJson('data/bias_log.json'),
    getJson('data/daytrade.json'), getJson('data/overnight.json')]);
  if(a.status === 'fulfilled') INTRA = a.value;
  if(b.status === 'fulfilled') LOG = b.value;
  if(c.status === 'fulfilled') DT = c.value;
  if(d.status === 'fulfilled') OVN = d.value;
  try{ TIDX = await getJson('data/team/index.json'); }catch(e){ TIDX = TIDX || {days: {}}; }
  try{ RADAR = await getJson('data/market_radar.json'); }catch(e){ /* 還沒有全市場資料 */ }
  try{ MIDX = await getJson('data/market/index.json'); }catch(e){ MIDX = MIDX || {days: {}}; }
  try{ JOURNAL = await getJson('data/journal.json'); }catch(e){ JOURNAL = JOURNAL || {trades: []}; }
  try{ BACKFILL = await getJson('data/backfill_status.json'); }catch(e){ /* 還沒回補過 */ }
  if(RADAR && RADAR.date){ try{ MDAY[RADAR.date] = await getJson(`data/market/${RADAR.date}.json`); }catch(e){} }
  const ds = Object.keys(TIDX.days || {}).sort();
  if(!PDATE || !ds.includes(PDATE)) PDATE = ds[ds.length - 1] || null;
  if(PDATE) await loadTeamDay(PDATE, true);
  render();
}

async function loadMarketDay(d){
  if(MDAY[d] !== undefined && (MDAY[d] === null || MDAY[d].closed)) return MDAY[d];
  try{ MDAY[d] = await getJson(`data/market/${d}.json`); }catch(e){ if(MDAY[d] === undefined) MDAY[d] = null; }
  return MDAY[d];
}
async function loadTeamDay(d, force){
  if(TDAY[d] && !force && TDAY[d].closed) return TDAY[d];
  try{ TDAY[d] = await getJson(`data/team/${d}.json`); }catch(e){ if(TDAY[d] === undefined) TDAY[d] = null; /* 那天沒有紀錄,不再重抓 */ }
  return TDAY[d];
}

// ---------- 小工具 ----------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isNum = x => typeof x === 'number' && isFinite(x);
const cls = x => !isNum(x) || x === 0 ? '' : (x > 0 ? 'up' : 'down');           // 台股習慣:紅漲綠跌
const pct = (x, d = 2) => isNum(x) ? `${x > 0 ? '+' : ''}${x.toFixed(d)}%` : '—';
const money = x => isNum(x) ? `${x > 0 ? '+' : x < 0 ? '-' : ''}$${Math.abs(Math.round(x)).toLocaleString()}` : '—';
const fmt = (x, d = 2) => isNum(x) ? Number(x.toFixed(d)).toLocaleString() : '—';
const names = () => Object.fromEntries(((INTRA && INTRA.watchlist_quotes) || []).map(q => [q.code, q.name]));
const ruleName = rk => (DT && DT.rules && DT.rules[rk] && DT.rules[rk].name) || ((INTRA && INTRA.bias && INTRA.bias.rules || {})[rk] || {}).name || rk;
const ruleType = rk => RULE_TYPE[rk.split('_')[0]] || rk;
const band = s => Math.abs(s) >= 80 ? '高(≥80)' : '中(60–79)';
const sideChip = s => s === 'long' ? '<span class="chip long">做多</span>' : '<span class="chip short">放空</span>';
const icon = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const IC = {
  bolt: '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>', doc: '<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
  wallet: '<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 14.5h2"/>', split: '<path d="M6 3v6a6 6 0 0 0 6 6 6 6 0 0 0 6-6V3M12 15v6"/>',
  cup: '<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', wind: '<path d="M3 8h11a3 3 0 1 0-3-3M3 16h15a3 3 0 1 1-3 3M3 12h9"/>',
  shield: '<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/>', target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>'
};
const kpi = (ic, lb, v, s, opt = {}) => `<div class="kpi"><div class="ic ${opt.gold ? 'gold' : ''}">${icon(IC[ic])}</div><div style="min-width:0"><div class="lb">${lb}</div><div class="v ${opt.cls || ''} ${opt.sm ? 'sm' : ''}">${v}</div>${s ? `<div class="s">${s}</div>` : ''}</div></div>`;

// 盤中實際成績(收盤後 daytrade_lab.py 用當天 5 分K 模擬,已扣來回成本 DT.cost_pct)
function trades(){
  const nm = names(), out = [];
  for(const [d, day] of Object.entries((LOG && LOG.days) || {})){
    for(const t of day.trig || []){
      if(!t.result) continue;
      out.push({ d, code: t.code, name: nm[t.code] || '', rule: t.rule, side: t.side, t: t.t, score: t.score, price: t.price,
        holds: !!t.holds, r: t.result, net: t.result.net, pnl: AMOUNT * t.result.net / 100 });
    }
  }
  return out.sort((a, b) => (b.d + b.t).localeCompare(a.d + a.t));
}
function stat(rows){
  const n = rows.length, win = rows.filter(x => x.net > 0).length, sum = rows.reduce((s, x) => s + x.net, 0);
  return { n, win: n ? win / n * 100 : null, avg: n ? sum / n : null, pnl: rows.reduce((s, x) => s + x.pnl, 0) };
}

function renderSys(){
  const el = document.getElementById('sysState'), tm = document.getElementById('sysTime');
  const as = INTRA && INTRA.data_as_of ? new Date(INTRA.data_as_of) : null;
  if(!as){ el.innerHTML = '<span class="dot warn"></span>沒有報價資料'; return; }
  const age = (Date.now() - as) / 60000;
  const tpe = new Date(Date.now() + 8 * 3600e3), hm = tpe.getUTCHours() * 60 + tpe.getUTCMinutes(), wd = tpe.getUTCDay();
  const open = wd >= 1 && wd <= 5 && hm >= 540 && hm <= 815;
  el.innerHTML = open ? (age <= 6 ? '<span class="dot ok"></span>已連線・永豐即時' : `<span class="dot warn"></span>資料延遲 ${Math.round(age)} 分鐘`)

function flowTag(p){
  const f = p.flow || {}, o = isNum(f.out15) && (f.n15 || 0) >= 50 ? f.out15 : f.out;
  if(!isNum(o)) return '';
  const good = p.side === 'long' ? o >= 55 : o <= 45, bad = p.side === 'long' ? o <= 40 : o >= 60;
  return `・<span class="${good ? (p.side === 'long' ? 'up' : 'down') : bad ? 'warnc' : ''}">外盤 ${o.toFixed(0)}%</span>`;
}
function pickRow(p){

      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px"><span class="mut" style="font-size:12px">偏空 −100</span>
        <b class="${md.side > 0 ? 'up' : md.side < 0 ? 'down' : ''}" style="font-size:18px">大盤${esc(md.label)} ${md.score > 0 ? '+' : ''}${md.score}${md.overheated ? '・過熱' : ''}</b><span class="mut" style="font-size:12px">+100 偏多</span></div>
      <div class="gauge"><em style="left:${(md.score + 100) / 2}%"></em></div>
      <div style="display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:10px;font-size:12px" class="mut">${Object.entries(md.parts || {}).map(([k, v]) => `<span>${esc(k)} <b class="num ${cls(v)}">${v > 0 ? '+' : ''}${v}</b></span>`).join('')}<span>漲 ${md.up} / 跌 ${md.down}</span><span>爆量家數 ${Math.round((md.hot || 0) * 100)}%</span></div>
      ${spark(day.mood || [])}
    </div></div>` : '';
  const card = p => {
    const L = p.last, F = p.first, mv = (p.close || p.now || {}).move;
    return `<div class="card pick ${p.active ? '' : 'faded'}">
      <div class="ph"><div><b class="pc">${esc(p.code)} ${esc(p.name)}</b> ${L.side ? sideChip(L.side > 0 ? 'long' : 'short') : '<span class="chip">觀望</span>'} ${vcChip(L.vc)}${p.active ? '' : ' <span class="chip">已不在名單</span>'}</div>
        <div class="r"><div class="num" style="font-size:16px;font-weight:650">${fmt((p.now || {}).price ?? L.price)}</div><div class="num ${cls(L.pct)}" style="font-size:12px">${pct(L.pct)}</div></div></div>
      <div class="obs">${L.ck.map(c => `<div class="ob"><span class="om ${c.s}">${MARK[c.s]}</span><span class="on">${ROLE_FULL[c.r] || esc(c.r)}</span><span class="ot">${esc(c.t)}</span></div>`).join('')}
        <div class="ob dec"><span class="om ${L.vc}">${MARK[L.vc]}</span><span class="on">決策員</span><span class="ot">${esc(L.v)}</span></div></div>
      <div class="pf">第一次 <b class="mono">${esc(F.t)}</b> @ <b class="num">${fmt(F.price)}</b>(${F.side > 0 ? '做多' : F.side < 0 ? '做空' : '觀望'}・${vcShort(F.vc, F.side)})
        ${F.side ? `・之後 <b class="num ${cls(mv)}">${pct(mv)}</b>${isNum(p.mfe) ? `・最大順向 <span class="num up">${pct(p.mfe)}</span>・最大逆向 <span class="num down">${pct(p.mae)}</span>` : ''}${p.close ? `・收盤淨 <b class="num ${cls(p.close.net)}">${pct(p.close.net)}</b>` : ''}` : ''}
        ${p.hist.length > 1 ? `<div class="hist">${p.hist.map(h => `<span><span class="mono">${esc(h.t)}</span> ${vcShort(h.vc, h.side)}</span>`).join('<i>→</i>')}</div>` : ''}</div>
    </div>`;
  };
  return head + dateChips + gauge + `
  <div class="card"><div class="kpis">
    ${kpi('target', '今天挑出', picks.length, `目前還在名單 ${picks.filter(p => p.active).length} 檔`)}
    ${kpi('shield', '可執行', picks.filter(p => p.best_vc === 'ok').length, '六關都過、已驗證規則觸發')}
    ${kpi('bolt', '有警示', picks.filter(p => p.best_vc === 'warn').length, '縮小部位或不建議')}
    ${kpi('split', day.closed ? '收盤平均' : '目前平均', `<span class="${cls(avg)}">${pct(avg)}</span>`, '照第一次推薦方向、用當時價格')}
    ${kpi('clock', '紀錄輪數', day.rounds, `最後更新 ${esc(day.as_of)}`, {gold: true})}
  </div></div>
  <div class="picks">${picks.map(card).join('')}</div>
  <p class="note">觀測員只用報價、量能、重大訊息、支撐壓力、當沖限制、回測結果機械式檢查;沒有回測站得住的規則觸發時,決策員最多只到「僅觀察」。「之後漲跌」是事後統計,不代表有成交,也不構成買賣建議。網頁「今日風控」是你自己裝置上的設定,這裡沒有算進去。</p>`;
}
const vcRank = vc => ({ok: 0, warn: 1, na: 2, bad: 3})[vc] ?? 4;
function spark(pts){
  if(pts.length < 2) return '';
  const W = 600, H = 60, x = i => i / (pts.length - 1) * W, y = v => H / 2 - v / 100 * (H / 2 - 4);
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:60px;margin-top:10px;display:block">
    <line x1="0" x2="${W}" y1="${H / 2}" y2="${H / 2}" stroke="var(--line)" stroke-dasharray="3 4"/>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>
    <div style="display:flex;justify-content:space-between;font-size:11px" class="mut mono"><span>${esc(pts[0][0])}</span><span>${esc(pts[pts.length - 1][0])}</span></div>`;
}

async function loadTeamHistory(){
  const src = TSRC === 'market' ? MIDX : TIDX;
  const ds = Object.keys((src && src.days) || {}).sort().reverse().slice(0, 30);
  await Promise.all(ds.map(d => TSRC === 'market' ? loadMarketDay(d) : loadTeamDay(d, false)));
  return ds;
}
function viewTeam(){
  const mk = TSRC === 'market', IDX = mk ? MIDX : TIDX, DAYS = mk ? MDAY : TDAY;
  const ds = Object.keys((IDX && IDX.days) || {}).sort().reverse().slice(0, 30);
  if(ds.some(d => DAYS[d] === undefined || (DAYS[d] && !DAYS[d].closed && IDX.days[d].closed))){ loadTeamHistory().then(render); }
  const rows = [];
  for(const d of ds){ const day = DAYS[d]; if(!day) continue;
    for(const [code, p] of Object.entries(day.picks || {})){
      const net = p.close ? p.close.net : null;
      if(isNum(net) && p.first.side) rows.push({d, code, p, net, s: p.first.s || p.first.ck.map(c => c.s)});
    }
  }
  const agg = xs => { const n = xs.length; return n ? {n, avg: xs.reduce((a, b) => a + b, 0) / n, win: xs.filter(x => x > 0).length / n * 100} : null; };
  const cell = a => a ? `<span class="num ${cls(a.avg)}">${pct(a.avg)}</span><div class="mut" style="font-size:11px">${a.n} 筆・勝率 ${a.win.toFixed(0)}%</div>` : '<span class="mut">—</span>';
  const roleRows = ROLES.map((r, i) => {
    const by = k => agg(rows.filter(x => x.s[i] === k).map(x => x.net));
    const ok = by('ok'), warn = by('warn');
    const gap = ok && warn ? ok.avg - warn.avg : null;
    return `<tr><td style="font-weight:600">${ROLE_FULL[r]}</td><td class="r">${cell(ok)}</td><td class="r">${cell(warn)}</td><td class="r">${cell(by('na'))}</td><td class="r">${cell(by('bad'))}</td>
      <td class="r num ${cls(gap)}">${isNum(gap) ? (gap > 0 ? '+' : '') + gap.toFixed(2) : '—'}</td></tr>`;
  }).join('');
  const grp = (label, f) => `<tr><td>${label}</td><td class="r">${cell(agg(rows.filter(f).map(x => x.net)))}</td></tr>`;
  const extra = mk ? [grp('做多推薦', x => x.p.first.side > 0), grp('做空推薦', x => x.p.first.side < 0),
      grp('分數 |≥60|(達門檻)', x => Math.abs(x.p.first.score || 0) >= 60), grp('分數 |40~59|', x => Math.abs(x.p.first.score || 0) < 60),
      grp('外盤比順向(做多 ≥55%/做空 ≤45%)', x => isNum(x.p.first.out15) && (x.p.first.side > 0 ? x.p.first.out15 >= 55 : x.p.first.out15 <= 45)),
      grp('外盤比逆向(做多 ≤45%/做空 ≥55%)', x => isNum(x.p.first.out15) && (x.p.first.side > 0 ? x.p.first.out15 <= 45 : x.p.first.out15 >= 55)),
      grp('五檔順向(失衡 ≥ +20% 同方向)', x => isNum(x.p.first.imb) && x.p.first.imb * x.p.first.side >= 20),
      grp('五檔逆向(失衡 ≥ 20% 反方向)', x => isNum(x.p.first.imb) && x.p.first.imb * x.p.first.side <= -20),
      grp('09:30 前推薦', x => x.p.first.t < '09:30'), grp('09:30~11:00', x => x.p.first.t >= '09:30' && x.p.first.t < '11:00'), grp('11:00 後', x => x.p.first.t >= '11:00')].join('')
    : ['ok', 'warn', 'na', 'bad'].map(k => grp(vcChip(k), x => x.p.first.vc === k)).join('');
  const days = ds.map(d => ({d, ...(IDX.days[d] || {})}));
  const dayRow = x => mk
    ? `<tr><td class="mono">${x.d}</td><td class="r num">${(x.long || {}).n ?? 0} / ${(x.short || {}).n ?? 0}</td>
        <td class="r num ${cls((x.long || {}).avg_net)}">${x.closed ? pct((x.long || {}).avg_net) : '<span class="mut">盤中</span>'}</td>
        <td class="r num ${cls((x.short || {}).avg_net)}">${x.closed ? pct((x.short || {}).avg_net) : '<span class="mut">盤中</span>'}</td>
        <td class="r num"><span class="up">${x.up ?? '—'}</span> / <span class="down">${x.down ?? '—'}</span></td><td class="r num ${cls(x.mood)}">${x.mood ?? '—'}</td></tr>`
    : `<tr style="cursor:pointer" data-gopd="${x.d}"><td class="mono">${x.d}</td><td class="r num">${x.picks ?? '—'}</td><td class="r num">${x.ok ?? 0}</td><td class="r num">${x.warn ?? 0}</td>
        <td class="r num ${cls(x.mood_close)}">${x.mood_close ?? '—'}</td><td class="r num ${cls(x.avg_net)}">${x.closed ? pct(x.avg_net) : '<span class="mut">盤中</span>'}</td><td class="r num">${isNum(x.win) ? x.win.toFixed(0) + '%' : '—'}</td></tr>`;
  const dayHead = mk ? '<th>日期</th><th class="r">推薦 多/空</th><th class="r">做多平均淨</th><th class="r">做空平均淨</th><th class="r">漲 / 跌家數</th><th class="r">情緒</th>'
    : '<th>日期</th><th class="r">挑出</th><th class="r">可執行</th><th class="r">警示</th><th class="r">收盤情緒</th><th class="r">平均淨報酬</th><th class="r">勝率</th>';
  return `
  <div class="head"><div><div class="eyebrow">OBSERVERS</div><h1>觀測員成績</h1>
    <p class="sub">每天的推薦和觀測員判斷都記下來,收盤後算「照第一次推薦方向、用當時價格、收盤出場、扣 0.23% 成本」的結果,看哪些判斷有用。</p></div></div>
  <div class="filters" style="border:0;padding:0 0 14px"><button data-tsrc="market" class="${mk ? 'on' : ''}">全市場雷達</button><button data-tsrc="watch" class="${mk ? '' : 'on'}">自選股觀測員</button></div>
  <div class="card"><h3>哪個觀測員準 <small>依第一次推薦時各觀測員的結果分組(${rows.length} 筆有收盤成績)</small></h3>
  ${rows.length ? `<div class="scroll"><table><thead><tr><th>觀測員</th><th class="r">✓ 通過</th><th class="r">! 警示</th><th class="r">· 中性</th><th class="r">✕ 硬限制</th><th class="r">通過 − 警示</th></tr></thead><tbody>${roleRows}</tbody></table></div>`
    : `<div class="empty">要等第一個有紀錄的交易日收盤後才有成績(每天 13:30 後計算)</div>`}</div>
  <div class="grid2">
    <div class="card"><h3>每天的紀錄</h3>${days.length ? `<div class="scroll"><table><thead><tr>${dayHead}</tr></thead><tbody>${days.map(dayRow).join('')}</tbody></table></div>` : '<div class="empty">還沒有紀錄</div>'}</div>
    <div class="card"><h3>${mk ? '哪種推薦比較準' : '決策員的結論準不準'}</h3>${rows.length ? `<div class="scroll"><table><thead><tr><th>分組</th><th class="r">收盤淨報酬</th></tr></thead><tbody>${extra}</tbody></table></div>` : '<div class="empty">收盤後才有成績</div>'}</div>
  </div>
  <p class="note">「通過 − 警示」是正的,代表這個觀測員說通過的,事後平均比說警示的好;接近 0 或負的,代表它的警示目前沒有分辨力。樣本少的時候數字變動很大,累積 20 個交易日以上比較有意義。</p>`;
}

function viewJournal(){
  const T = ((JOURNAL && JOURNAL.trades) || []).slice().sort((a, b) => (b.date + (b.time_in || '')).localeCompare(a.date + (a.time_in || '')) || b.id - a.id);
  const head = `<div class="head"><div><div class="eyebrow">MY TRADES</div><h1>我的交易</h1>
    <p class="sub">你做的每一筆(跟 Claude 說,幫你記進 data/journal.json),自動對照當天雷達有沒有推薦,看「照推薦做」和「自己判斷」哪個勝率高。</p></div></div>`;
  const how = `<div class="card"><h3>怎麼記</h3><div style="padding:12px 18px;font-size:13px;line-height:1.9">跟 Claude 說,例如:
    <div class="mono" style="background:var(--chip);border-radius:8px;padding:8px 12px;margin:6px 0">今天做多 2330,09:35 1050 買,10:20 1062 賣,1 張</div>
    <span class="mut">做空就說「做空 / 先賣後買」。損益用手續費 0.1425% 打 2.8 折(每邊最低 20 元)、當沖證交稅 0.15% 計算,實際以券商對帳單為準。</span></div></div>`;
  if(!T.length) return head + `<div class="card"><div class="empty">還沒有交易紀錄</div></div>` + how;
  const st = xs => { const n = xs.length, w = xs.filter(t => t.net > 0).length, net = xs.reduce((a, t) => a + t.net, 0);
    const wins = xs.filter(t => t.net > 0).map(t => t.net), losses = xs.filter(t => t.net <= 0).map(t => -t.net);
    const aw = wins.length ? wins.reduce((a, b) => a + b, 0) / wins.length : 0, al = losses.length ? losses.reduce((a, b) => a + b, 0) / losses.length : 0;
    return {n, win: n ? w / n * 100 : null, net, avg: n ? net / n : null, payoff: wins.length && losses.length ? aw / al : null}; };
  const all = st(T), days = [...new Set(T.map(t => t.date))];
  const follow = st(T.filter(t => t.rec && t.rec.same_side)), own = st(T.filter(t => !t.rec)), against = st(T.filter(t => t.rec && !t.rec.same_side));
  const row = (label, s) => `<tr><td>${label}</td><td class="r num">${s.n}</td><td class="r num">${isNum(s.win) ? s.win.toFixed(0) + '%' : '—'}</td>
    <td class="r num ${cls(s.avg)}">${money(s.avg)}</td><td class="r num">${isNum(s.payoff) ? s.payoff.toFixed(2) : '—'}</td><td class="r num ${cls(s.net)}">${money(s.net)}</td></tr>`;
  const byDay = days.map(d => ({d, ...st(T.filter(t => t.date === d))}));
  const tm = t => t.time_in || '';
  return head + `
  <div class="card"><div class="kpis">
    ${kpi('clock', '交易天數', days.length, `${days[days.length - 1]} 起`)}
    ${kpi('doc', '筆數', all.n, `賺 ${T.filter(t => t.net > 0).length}・賠 ${T.filter(t => t.net <= 0).length}`)}
    ${kpi('split', '勝率', isNum(all.win) ? all.win.toFixed(0) + '%' : '—', `賺賠比 ${isNum(all.payoff) ? all.payoff.toFixed(2) : '—'}`)}
    ${kpi('wallet', '淨損益', `<span class="${cls(all.net)}">${money(all.net)}</span>`, `平均每筆 ${money(all.avg)}`)}
    ${kpi('cup', '照推薦做', isNum(follow.win) ? follow.win.toFixed(0) + '%' : '—', `${follow.n} 筆・<span class="${cls(follow.net)}">${money(follow.net)}</span>`, {gold: true})}
  </div></div>
  <div class="grid2">
    <div class="card"><h3>照推薦做 vs 自己判斷</h3><div class="scroll"><table><thead><tr><th>分組</th><th class="r">筆數</th><th class="r">勝率</th><th class="r">平均每筆</th><th class="r">賺賠比</th><th class="r">淨損益</th></tr></thead><tbody>
      ${row('照推薦方向做', follow)}${row('雷達沒推薦(自己判斷)', own)}${row('跟推薦反方向', against)}
      ${row('做多', st(T.filter(t => t.side === 'long')))}${row('做空', st(T.filter(t => t.side === 'short')))}
      ${row('09:30 前進場', st(T.filter(t => tm(t) && tm(t) < '09:30')))}${row('09:30 後進場', st(T.filter(t => tm(t) >= '09:30')))}
    </tbody></table></div></div>
    <div class="card"><h3>每日統計</h3><div class="scroll"><table><thead><tr><th>日期</th><th class="r">筆數</th><th class="r">勝率</th><th class="r">淨損益</th></tr></thead><tbody>
      ${byDay.map(x => `<tr><td class="mono">${x.d}</td><td class="r num">${x.n}</td><td class="r num">${x.win.toFixed(0)}%</td><td class="r num ${cls(x.net)}">${money(x.net)}</td></tr>`).join('')}
    </tbody></table></div></div>
  </div>
  <div class="card"><h3>每一筆</h3><div class="scroll"><table><thead><tr><th>日期</th><th>標的</th><th>方向</th><th class="r">進 → 出</th><th class="r">股數</th><th class="r">報酬%</th><th class="r">淨損益</th><th>推薦對照</th><th>備註</th></tr></thead><tbody>
    ${T.map(t => `<tr><td class="mono mut">${t.date}${t.time_in ? '<br>' + esc(t.time_in) + (t.time_out ? '→' + esc(t.time_out) : '') : ''}</td><td class="code">${esc(t.code)}<span>${esc(t.name)}</span></td>
      <td>${sideChip(t.side)}</td><td class="r num">${fmt(t.entry)} → ${fmt(t.exit)}</td><td class="r num">${t.shares.toLocaleString()}</td>
      <td class="r num ${cls(t.pct)}">${pct(t.pct)}</td><td class="r num ${cls(t.net)}">${money(t.net)}<div class="mut" style="font-size:11px">費 ${t.fee}・稅 ${t.tax}</div></td>
      <td class="why">${t.rec ? `${t.rec.src === 'market' ? '雷達' : '自選'} ${esc(t.rec.first_t)} ${t.rec.same_side ? '同方向' : '<b class="down">反方向</b>'} @${fmt(t.rec.first_price)}${isNum(t.rec.score) ? `・分數 ${t.rec.score}` : ''}` : '<span class="mut">沒推薦</span>'}</td>
      <td class="why">${esc(t.note || '')}</td></tr>`).join('')}
  </tbody></table></div></div>` + how;
}

      <span class="mut">回測原本只用 Yahoo 約 60 天(量也不完整),補完後樣本約 4 倍,而且和盤中一樣用永豐資料。每天回測重算後,下面的結果會跟著更新。</span></div></div>` : ''}
  <div class="card"><h3>當沖規則 <small>${DT ? `回測 ${DT.first || ''} ~ ${DT.last || ''}(${DT.days} 天),成本 ${DT.cost_pct}%` : ''}</small></h3>
  ${rows.length ? `<div class="scroll"><table><thead><tr><th>規則</th><th>條件</th><th class="r">樣本外筆數</th><th class="r">勝率</th><th class="r">平均報酬</th><th class="r">盤中實際</th><th>判定</th></tr></thead><tbody>
    ${rows.map(({k, r, t, lv}) => `<tr><td style="font-weight:600;white-space:nowrap">${esc(r.name)} ${sideChip(r.side)}</td><td class="why">${esc(r.desc)}</td>
      <td class="r num">${t.n}</td><td class="r num">${isNum(t.win) ? t.win.toFixed(0) + '%' : '—'}</td><td class="r num ${cls(t.avg)}">${pct(t.avg, 3)}</td>
      <td class="r num ${cls(lv && lv.avg)}">${lv ? `${pct(lv.avg, 3)}<div class="mut" style="font-size:11px">${lv.n} 筆</div>` : '—'}</td>
      <td>${r.holds ? '<span class="chip green">站得住</span>' : '<span class="chip">不採用</span>'}</td></tr>`).join('')}
  </tbody></table></div>` : `<div class="empty">還沒有回測結果</div>`}</div>
  <p class="note">平均報酬是每筆扣成本後的百分比。樣本外平均是負的規則,盤中觸發一律只當作觀察。</p>`;
}

function bind(){
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { TAB = b.dataset.tab; SHOW = 30; render(); });
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { FILTER = b.dataset.f; SHOW = 30; render(); });
  document.querySelectorAll('[data-act="reload"]').forEach(b => b.onclick = loadAll);
  document.querySelectorAll('[data-act="more"]').forEach(b => b.onclick = () => { SHOW += 30; render(); });
  document.querySelectorAll('[data-tsrc]').forEach(b => b.onclick = () => { TSRC = b.dataset.tsrc; render(); });
  document.querySelectorAll('[data-pd]').forEach(b => b.onclick = async () => { PDATE = b.dataset.pd; await loadTeamDay(PDATE, false); render(); });
  document.querySelectorAll('[data-gopd]').forEach(b => b.onclick = async () => { PDATE = b.dataset.gopd; await loadTeamDay(PDATE, false); VIEW = 'picks'; render(); window.scrollTo(0, 0); });
  const amt = document.getElementById('amt');
  if(amt) amt.onchange = () => { const v = Number(amt.value); if(v > 0){ AMOUNT = v; store.set(AMT_KEY, String(v)); render(); } };
}

document.querySelectorAll('#nav button').forEach(b => b.onclick = () => { VIEW = b.dataset.v; SHOW = 30; render(); window.scrollTo(0, 0); });
const th = store.get(TH_KEY); if(th) document.documentElement.dataset.theme = th;
document.getElementById('themeBtn').onclick = () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'light' : 'dark'; store.set(TH_KEY, document.documentElement.dataset.theme);
};
loadAll();
setInterval(() => { if(!document.hidden) loadAll(); }, 60000);
// 盤中迴圈每輪寫 data/stamp.json,每 15 秒看一次,有新的一輪就馬上重抓
setInterval(async () => {
  if(document.hidden || !INTRA) return;
  try{ const s = await getJson('data/stamp.json'); if(s.checked_at && s.checked_at !== INTRA.checked_at) loadAll(); }catch(e){}
}, 15000);
</script>
</body>
</html>
