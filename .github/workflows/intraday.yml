name: 盤中即時報價

on:
  schedule:
    # 台北時間 09:00-13:40,每20分鐘跑一次,週一到週五(UTC 01:00-05:40)
    - cron: "0,20,40 1-5 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  intraday:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安裝套件
        run: pip install requests
      - name: 抓即時報價
        run: python intraday.py
      - name: 把結果存回repo
        run: |
          git config user.name "tw-signal-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/intraday_latest.json data/intraday_history.json
          git diff --quiet --cached || git commit -m "盤中報價更新 $(date -u -d '+8 hours' +'%Y-%m-%d %H:%M')"
          git push
