name: 盤中即時報價

on:
  schedule:
    # 週一到週五 08:10 直接開跑(離開盤 40 分鐘)。晚上兩次是 cron 晚到時的備援。
    # 下一個交易日比明天還遠(週末、連假)就不連續睡 5 小時;平日晚上仍會睡一段接到早上。
    - cron: "10 0 * * 1-5"   # 08:10 台北(週一~週五)
    - cron: "0 13 * * 0-4"   # 21:00 台北(週日~週四)
    - cron: "0 17 * * 0-4"   # 01:00 台北(週一~週五凌晨)
  workflow_dispatch: {}

# 同一時間只留一個在跑、一個在排隊(新的排隊會取代舊的排隊),所以接力和 cron 疊在一起也只會有一條。
concurrency:
  group: intraday-scan
  cancel-in-progress: false

permissions:
  contents: write
  actions: write          # 接力:用 GITHUB_TOKEN 觸發自己和回補(workflow_dispatch 允許這樣做)

jobs:
  intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 355     # hosted runner 上限 360;08:30 叫醒 → 13:40 收盤 → 存檔約 13:50,還有餘裕
    steps:
      - uses: actions/checkout@v7
      - name: 接力待命(離開盤太久就先睡一段,再叫醒下一棒)
        id: relay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            others=$(gh run list -R "$GITHUB_REPOSITORY" --workflow intraday.yml --limit 20 \
              --json databaseId,status \
              --jq "[.[] | select(.databaseId != ${{ github.run_id }} and (.status == \"in_progress\" or .status == \"queued\"))] | length" \
              2>/dev/null || echo 0)
            if [ "${others:-0}" != "0" ]; then
              echo "已有盤中接力在跑或排隊,這次定時備援直接結束"
              echo "run=no" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          plan=$(python3 tradingday.py --relay)
          echo "$plan"
          action=$(printf '%s\n' "$plan" | sed -n 's/^action=//p')
          seconds=$(printf '%s\n' "$plan" | sed -n 's/^seconds=//p')
          if [ "$action" = "run" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$action" = "wait_cron" ] || [ "$action" != "nap" ]; then
            echo "下一個交易日比明天還遠,或判斷失敗,不佔 runner。08:10 與 01:00 的 cron 會再試"
            echo "run=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "先睡 ${seconds} 秒,再叫醒下一棒"
          sleep "$seconds"
          for k in 1 2 3 4 5; do
            gh workflow run intraday.yml -R "$GITHUB_REPOSITORY" --ref main && break
            echo "叫醒失敗,30 秒後重試($k)"; sleep 30
          done
          echo "run=no" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        if: steps.relay.outputs.run == 'yes'
        with:
          python-version: "3.11"
          cache: pip                          # 永豐套件第一次裝要2分鐘,之後用快取
          cache-dependency-path: requirements.txt
      - name: 安裝套件
        if: steps.relay.outputs.run == 'yes'
        run: pip install -r requirements.txt
      - name: 隔夜風向(開盤前排程沒跑到時補拍;08:45 之後只會記美股)
        if: steps.relay.outputs.run == 'yes'
        continue-on-error: true
        run: timeout 60 python overnight.py
      - name: 常駐迴圈:對齊 5 分K 收盤抓報價並存回repo,直到收盤(loop.py)
        if: steps.relay.outputs.run == 'yes'
        env:
          # 永豐金鑰只放這一步。接力、隔夜風向、收盤叫醒都碰不到。沒設也能跑,會改用鉅亨。
          SJ_API_KEY: ${{ secrets.SJ_API_KEY }}
          SJ_SECRET_KEY: ${{ secrets.SJ_SECRET_KEY }}
        run: |
          set -o pipefail      # loop.py 當掉時這一步要顯示失敗,不能被 sed 的結束碼蓋掉
          git config user.name "tw-signal-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          # repo 是公開的,執行記錄大家看得到:輸出先遮掉身分證字號、帳號格式的字串
          python -u loop.py 2>&1 | sed -u -E -e 's/[A-Z][12][0-9]{8}/[已遮蔽]/g' -e "s/(account_id|person_id|broker_id)([\\\"' :=]+)[0-9A-Za-z]+/\\1\\2[已遮蔽]/g"
      - name: 收盤後叫醒下一棒(下一個交易日太遠就交給 cron)
        if: always() && steps.relay.outputs.run == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          action=$(python3 tradingday.py --relay | sed -n 's/^action=//p')
          if [ "$action" = "wait_cron" ]; then
            echo "下一個交易日比明天還遠,不接力。08:10 與 01:00 的 cron 會再試"
          else
            gh workflow run intraday.yml -R "$GITHUB_REPOSITORY" --ref main || echo "叫醒失敗,明天靠 cron 備援"
          fi
          # 收盤後直接叫永豐回補(存今天的 5 分K + 補歷史)。GitHub cron 常晚 4~6 小時,過了 23:30 回補就不跑(10/29、10/30 都這樣沒存到),
          # 用 dispatch 不會延遲;回補和回測在同一條 bars5m-writers 佇列,不會同時寫 .gz。晚上 19:15 的 cron 留著當備援
          if [ "$(TZ=Asia/Taipei date +%H%M)" -ge 1335 ]; then
            gh workflow run sj_backfill.yml -R "$GITHUB_REPOSITORY" --ref main || echo "叫回補失敗,晚上靠 cron 備援"
          fi
