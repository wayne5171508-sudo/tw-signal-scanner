name: 盤中即時報價

on:
  schedule:
    # GitHub的cron在低活躍repo常常延遲或整批跳過(例:10/29 08:40 沒觸發),所以主要靠下面的「接力」:
    # 每天收盤後這個 workflow 會自己叫醒自己,睡到隔天開盤前。cron 只是接力斷掉時的備援。
    - cron: "40 0 * * 1-5"   # 08:40 台北(會等到08:55再開始)
    - cron: "5 1 * * 1-5"    # 09:05
    - cron: "35 1 * * 1-5"   # 09:35
    - cron: "5 2 * * 1-5"    # 10:05
    - cron: "5 3 * * 1-5"    # 11:05
    - cron: "5 4 * * 1-5"    # 12:05
    # 晚上再兩個:接力那一棒被取消或 runner 掛掉時(那條路沒有 always() 叫醒),當晚就能接回來
    - cron: "0 13 * * 0-4"   # 21:00 台北(週日~週四)
    - cron: "0 17 * * 0-4"   # 01:00 台北(週一~週五凌晨)
  workflow_dispatch: {}

# 同一時間只留一個在跑、一個在排隊(新的排隊會取代舊的排隊),所以接力和 cron 疊在一起也只會有一條。
concurrency:
  group: intraday-scan
  cancel-in-progress: false

permissions:
  contents: write
  actions: write          # 接力:用 GITHUB_TOKEN 觸發自己和回補(workflow_dispatch 允許這樣做)

jobs:
  intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 355     # hosted runner 上限 360;08:30 叫醒 → 13:40 收盤 → 存檔約 13:50,還有餘裕
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 接力待命(離開盤太久就先睡一段,再叫醒下一棒)
        id: relay
        run: |
          now=$(date +%s)
          next=""
          for i in 0 1 2 3 4 5 6 7; do
            d=$(TZ=Asia/Taipei date -d "today +${i} day 08:50" +%s)
            end=$(TZ=Asia/Taipei date -d "today +${i} day 13:40" +%s)
            dw=$(TZ=Asia/Taipei date -d "today +${i} day" +%u)
            # 離收盤不到 10 分鐘就當作今天結束(不然收盤叫醒的下一棒會再跑一輪、又叫醒下一棒,一直到 13:40)
            if [ "$dw" -le 5 ] && [ "$end" -gt "$(( now + 600 ))" ]; then next=$d; break; fi
          done
          wait_s=$(( next - now ))
          echo "下一個開盤日 08:50 還有 ${wait_s} 秒"
          if [ "$wait_s" -le 2400 ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"; exit 0
          fi
          nap=$(( wait_s - 1200 )); [ "$nap" -gt 18000 ] && nap=18000   # 一棒最多睡 5 小時(job 上限 6 小時);最後一棒約 08:30 醒
          echo "先睡 ${nap} 秒,再叫醒下一棒"
          sleep "$nap"
          for k in 1 2 3 4 5; do
            gh workflow run intraday.yml -R "$GITHUB_REPOSITORY" --ref main && break
            echo "叫醒失敗,30 秒後重試($k)"; sleep 30
          done
          echo "run=no" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.relay.outputs.run == 'yes'
      - uses: actions/setup-python@v6
        if: steps.relay.outputs.run == 'yes'
        with:
          python-version: "3.11"
          cache: pip                          # 永豐套件第一次裝要2分鐘,之後用快取
          cache-dependency-path: requirements.txt
      - name: 安裝套件
        if: steps.relay.outputs.run == 'yes'
        run: pip install requests shioaji
      - name: 隔夜風向(開盤前排程沒跑到時補拍;08:45 之後只會記美股)
        if: steps.relay.outputs.run == 'yes'
        continue-on-error: true
        run: timeout 60 python overnight.py
      - name: 常駐迴圈:對齊 5 分K 收盤抓報價並存回repo,直到收盤(loop.py)
        if: steps.relay.outputs.run == 'yes'
        env:
          SJ_API_KEY: ${{ secrets.SJ_API_KEY }}       # 永豐金鑰(沒設也能跑,會自動改用鉅亨)
          SJ_SECRET_KEY: ${{ secrets.SJ_SECRET_KEY }}
        run: |
          set -o pipefail      # loop.py 當掉時這一步要顯示失敗,不能被 sed 的結束碼蓋掉
          git config user.name "tw-signal-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          # repo 是公開的,執行記錄大家看得到:輸出先遮掉身分證字號、帳號格式的字串
          python -u loop.py 2>&1 | sed -u -E -e 's/[A-Z][12][0-9]{8}/[已遮蔽]/g' -e "s/(account_id|person_id|broker_id)([\\\"' :=]+)[0-9A-Za-z]+/\\1\\2[已遮蔽]/g"
      - name: 收盤後叫醒下一棒(睡到下一個開盤日)
        if: always() && steps.relay.outputs.run == 'yes'
        run: |
          gh workflow run intraday.yml -R "$GITHUB_REPOSITORY" --ref main || echo "叫醒失敗,明天靠 cron 備援"
          # 收盤後直接叫永豐回補(存今天的 5 分K + 補歷史)。GitHub cron 常晚 4~6 小時,過了 23:30 回補就不跑(10/29、10/30 都這樣沒存到),
          # 用 dispatch 不會延遲;回補和回測在同一條 bars5m-writers 佇列,不會同時寫 .gz。晚上 19:15 的 cron 留著當備援
          if [ "$(TZ=Asia/Taipei date +%H%M)" -ge 1335 ]; then
            gh workflow run sj_backfill.yml -R "$GITHUB_REPOSITORY" --ref main || echo "叫回補失敗,晚上靠 cron 備援"
          fi
