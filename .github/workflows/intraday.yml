name: 盤中即時報價

on:
  schedule:
    # 台北時間 09:00-13:40,每5分鐘跑一次,週一到週五(UTC 01:00-05:40)
    - cron: "*/5 1-5 * * 1-5"
  workflow_dispatch: {}

# 排程改成5分鐘一次後,手動按「Run workflow」有機會跟排程本身的執行時間重疊;加這個讓同一個
# workflow不要同時跑兩份(排隊等上一個跑完再跑,不取消正在跑的那個),避免兩邊同時git push
# 互搶造成失敗。
concurrency:
  group: intraday-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  intraday:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: 安裝套件
        run: pip install requests
      - name: 抓即時報價 + 檢查觸價通知
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python intraday.py
      - name: 把結果存回repo
        run: |
          git config user.name "tw-signal-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/intraday_latest.json data/intraday_history.json data/alerts_state.json data/daily_bars.json
          git diff --quiet --cached || git commit -m "盤中報價更新 $(date -u -d '+8 hours' +'%Y-%m-%d %H:%M')"
          # 萬一偶爾還是跟別的執行撞在一起導致push被拒絕,先拉一次再重推一次,
          # 真的還是不行才讓這步驟失敗(紅叉),不要默默放棄這次的資料。
          git push || (git pull --rebase origin main && git push)
