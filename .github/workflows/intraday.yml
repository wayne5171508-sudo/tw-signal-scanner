name: 盤中即時報價

on:
  schedule:
    # GitHub的cron在低活躍repo常常延遲或整批跳過,所以不再依賴「每5分鐘觸發一次」。
    # 改成:交易日開盤前後多設幾個觸發點,任何一個觸發成功就會開始一個長時間迴圈,
    # 在迴圈裡自己每5分鐘抓一次,一直跑到13:40(台北)。
    - cron: "40 0 * * 1-5"   # 08:40 台北
    - cron: "5 1 * * 1-5"    # 09:05
    - cron: "35 1 * * 1-5"   # 09:35
    - cron: "5 2 * * 1-5"    # 10:05
    - cron: "5 3 * * 1-5"    # 11:05
    - cron: "5 4 * * 1-5"    # 12:05
  workflow_dispatch: {}

# 同一時間只留一個迴圈在跑;後面觸發的排隊,前一個結束(13:40)後會發現已過收盤而立刻結束。
concurrency:
  group: intraday-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: 安裝套件
        run: pip install requests
      - name: 迴圈:每5分鐘抓報價並存回repo,直到收盤
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          git config user.name "tw-signal-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          end_epoch=$(TZ=Asia/Taipei date -d "today 13:40" +%s)
          start_epoch=$(TZ=Asia/Taipei date -d "today 08:55" +%s)
          now=$(date +%s)
          if [ "$now" -lt "$start_epoch" ] || [ "$now" -gt "$end_epoch" ]; then
            echo "不在交易時段,結束"; exit 0
          fi
          while [ "$(date +%s)" -le "$end_epoch" ]; do
            loop_start=$(date +%s)
            python intraday.py || echo "這一輪抓取失敗,5分鐘後再試"
            git add data/intraday_latest.json data/intraday_history.json data/alerts_state.json data/daily_bars.json
            if ! git diff --quiet --cached; then
              git commit -m "盤中報價更新 $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')"
              git push || (git pull --rebase origin main && git push) || echo "push失敗,下一輪再推"
            fi
            elapsed=$(( $(date +%s) - loop_start ))
            sleep_for=$(( 300 - elapsed ))
            [ "$sleep_for" -gt 0 ] && sleep "$sleep_for"
          done
