name: 每日巡檢(補跑漏掉的排程)

on:
  schedule:
    # GitHub 的 cron 會延遲或跳過,所以巡檢也設兩個時間;第二次發現都正常就什麼都不做。
    - cron: "30 13 * * 1-5"   # 21:30 台北
    - cron: "0 15 * * 1-5"    # 23:00 台北
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - name: 巡檢並補跑
        run: |
          set -u
          now=$(TZ=Asia/Taipei date +'%F %H:%M')
          # 目標是最近一個已收盤交易日,不是日曆今天。cron 延到隔天凌晨時,「今天」還沒開盤,FMTQIK 不會有那一天。
          target=$(python3 tradingday.py --print | tail -1)
          echo "台北 ${now} 最近已收盤交易日: ${target:-未知}"
          echo "## 巡檢 ${now}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 最近已收盤交易日: ${target:-未知}" >> "$GITHUB_STEP_SUMMARY"

          busy() {  # 這個 workflow 現在是否正在跑或排隊
            [ -n "$(gh run list -R "$REPO" --workflow "$1" --limit 20 --json status --jq '.[]|select(.status!="completed")|.status' | head -1)" ]
          }
          dispatch() {
            if busy "$1"; then echo "- $1 正在跑,不重複觸發" >> "$GITHUB_STEP_SUMMARY"
            else gh workflow run "$1" -R "$REPO" && echo "- 已補跑 $1($2)" >> "$GITHUB_STEP_SUMMARY"; fi
          }

          if [ -n "$target" ]; then
            scan_date=$(python3 -c "import json;print(json.load(open('data/latest.json')).get('date',''))" 2>/dev/null || echo "")
            bear_date=$(python3 -c "import json;print(json.load(open('data/bear_scorecard.json')).get('latest_bar',''))" 2>/dev/null || echo "")
            echo "盤後掃描日期=${scan_date} 利空回測日K=${bear_date}"
            echo "- 盤後掃描資料日期: ${scan_date:-無}" >> "$GITHUB_STEP_SUMMARY"
            echo "- 利空回測最新日K: ${bear_date:-無}" >> "$GITHUB_STEP_SUMMARY"
            [ "$scan_date" = "$target" ] || dispatch scan.yml "資料停在 ${scan_date:-無}"
            [ "$bear_date" = "$target" ] || dispatch bear.yml "日K停在 ${bear_date:-無}"
          else
            echo "- 查不到交易日,這次不補跑掃描和利空" >> "$GITHUB_STEP_SUMMARY"
          fi

          # 過去 26 小時、第一次就失敗的 run,依 workflow 各自查。
          # 全 repo 混在一起時 --limit 50 會被盤中和 Pages 塞滿,26 小時內的失敗會漏看。
          since=$(date -u -d '-26 hours' +%Y-%m-%dT%H:%M:%SZ)
          for spec in "intraday.yml 250" "scan.yml 40" "bear.yml 40" "sj_backfill.yml 40" "overnight.yml 40" "tests.yml 40" "backfill.yml 20"; do
            wf=${spec%% *}
            lim=${spec##* }
            gh run list -R "$REPO" --workflow "$wf" --limit "$lim" \
              --json databaseId,workflowName,conclusion,createdAt,event,attempt \
              --jq ".[]|select(.createdAt>=\"$since\" and (.conclusion==\"failure\" or .conclusion==\"timed_out\" or .conclusion==\"startup_failure\") and .attempt==1 and .event!=\"push\")|\"\(.databaseId)\t\(.workflowName)\"" \
            | while IFS=$'\t' read -r id name; do
                gh run rerun "$id" -R "$REPO" --failed && echo "- 已重跑失敗的「${name}」(#${id})" >> "$GITHUB_STEP_SUMMARY"
              done
          done

          echo "巡檢完成"
