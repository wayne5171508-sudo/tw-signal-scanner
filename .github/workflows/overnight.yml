name: 隔夜風向(開盤前)

on:
  schedule:
    # 台指期夜盤 05:00 收、日盤 08:45 開,中間這段報價才是夜盤收盤。
    # GitHub 的 cron 常延遲或跳過,多設幾個點;今天拍過就會很快結束。
    - cron: "10 22 * * 0-4"   # 06:10 台北(週一~週五)
    - cron: "10 23 * * 0-4"   # 07:10 台北
    - cron: "15 0 * * 1-5"    # 08:15 台北
  workflow_dispatch: {}

concurrency:
  group: overnight
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  overnight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: 安裝套件
        run: pip install requests
      - name: 拍隔夜風向快照
        run: python overnight.py
      - name: 存回 repo
        run: bash .github/scripts/commit_data.sh "隔夜風向 $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')" data/overnight.json
