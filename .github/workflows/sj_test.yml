name: 永豐API模擬測試
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -U shioaji
      - name: 模擬登入與下單測試
        env:
          SJ_API_KEY: ${{ secrets.SJ_API_KEY }}
          SJ_SECRET_KEY: ${{ secrets.SJ_SECRET_KEY }}
        run: |
          set -o pipefail
          cat > t.py <<'EOF'
          import os, time
          import shioaji as sj
          api = sj.Shioaji(simulation=True)
          api.login(api_key=os.environ["SJ_API_KEY"], secret_key=os.environ["SJ_SECRET_KEY"])
          print("RESULT 登入成功, 版本", sj.__version__)
          time.sleep(2)
          c = api.Contracts.Stocks.TSE["2890"]
          o = api.Order(price=c.reference or c.limit_down, quantity=1,
                        action=sj.constant.Action.Buy,
                        price_type=sj.constant.StockPriceType.LMT,
                        order_type=sj.constant.OrderType.ROD,
                        account=api.stock_account)
          t = api.place_order(c, o)
          print("RESULT 模擬下單送出:", t.status.status)
          time.sleep(2)
          api.logout()
          EOF
          python -u t.py 2>&1 | sed -E 's/[A-Z][12][0-9]{8}/[已遮蔽]/g'
