name: 收盤後籌碼掃描

on:
  schedule:
    # 週一到週五 台北時間 18:20 執行 (UTC 10:20)
    - cron: "20 10 * * 1-5"
  workflow_dispatch: {}   # 這行讓你可以在GitHub網站上手動按「Run workflow」測試

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行掃描
        run: python scan.py > latest.json

      - name: 顯示結果(方便在Actions頁面直接看)
        run: cat latest.json

      - name: 把結果存回repo
        run: |
          mkdir -p data
          # 用資料本身的交易日命名(排程常延遲到隔天凌晨才跑,用執行日命名會錯位)
          d=$(python -c "import json;print(json.load(open('latest.json')).get('date',''))")
          st=$(python -c "import json;print(json.load(open('latest.json')).get('market_status',''))")
          case "$d" in 20??-??-??) ;; *) echo "沒有交易日,不寫檔"; d=""; esac
          if [ -n "$d" ] && [ -f "data/${d}.json" ] && cmp -s latest.json "data/${d}.json"; then
            echo "${d} 掃描結果已存在且內容相同,不覆蓋"
            # 日期檔已是這一份;latest.json 若還停在更早的日子,只把它指回來,不重算
            if [ ! -f data/latest.json ] || ! cmp -s latest.json data/latest.json; then
              cp latest.json data/latest.json
            fi
          elif [ -n "$d" ] && [ "$st" = "OK" ]; then
            cp latest.json "data/${d}.json"
            cp latest.json data/latest.json
            python health.py || true
          else
            echo "這次 market_status=${st:-無},不覆蓋既有的 ${d:-檔案}"
          fi
          bash .github/scripts/commit_data.sh "掃描結果 ${d}" data/
