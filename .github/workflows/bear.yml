name: 收盤後利空回測

on:
  schedule:
    # 收盤 13:30,盤中迴圈 13:40 結束;14:30 再跑,日K才是正式的今天那根。
    # GitHub 的 cron 可能延遲或跳過,15:30 再補一次;同一天已更新過就會很快結束。
    - cron: "30 6 * * 1-5"   # 14:30 台北
    - cron: "30 7 * * 1-5"   # 15:30 台北
  workflow_dispatch:
    inputs:
      force:
        description: "非交易日也強制重算(測試用)"
        type: boolean
        default: false

# 和盤中迴圈分開排隊,但都會改 data/,所以 push 前一定先 pull
# 和 sj_backfill.yml 排同一條隊:兩邊都會寫 data/bars5m*/*.json.gz,不能同時改
concurrency:
  group: bars5m-writers
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bear:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: 安裝套件
        run: pip install requests
      - name: 今天已經算過就跳過
        id: check
        env:
          FORCE: ${{ inputs.force }}
        run: |
          today=$(TZ=Asia/Taipei date +%Y-%m-%d)
          if [ "$FORCE" != "true" ] && [ -f data/bear_scorecard.json ] \
             && grep -q "\"latest_bar\": \"$today\"" data/bear_scorecard.json; then
            echo "今天的成績單已經更新過"; echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - name: 跑利空回測
        if: steps.check.outputs.skip != '1'
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then python bear_signals.py --force; else python bear_signals.py; fi
      - name: 跑當沖規則回測
        if: steps.check.outputs.skip != '1'
        continue-on-error: true
        run: python daytrade_lab.py
      - name: 1 分K 存到 data-archive 分支(不進網站,只新增不覆蓋)
        if: steps.check.outputs.skip != '1'
        continue-on-error: true
        run: |
          ls data/bars1m/*.json.gz >/dev/null 2>&1 || { echo "這次沒有 1 分K"; exit 0; }
          git config user.name "tw-signal-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data-archive >/dev/null 2>&1; then
            git fetch -q origin data-archive
            git worktree add -q /tmp/archive origin/data-archive -B data-archive
          else
            git worktree add -q --orphan -b data-archive /tmp/archive
          fi
          mkdir -p /tmp/archive/bars1m
          cp -n data/bars1m/*.json.gz /tmp/archive/bars1m/
          cd /tmp/archive
          git add bars1m
          if git diff --quiet --cached; then echo "1 分K 沒有新的日子"; exit 0; fi
          git commit -q -m "1 分K 存檔 $(TZ=Asia/Taipei date +'%Y-%m-%d')"
          git push -q origin data-archive
      - name: 存回 repo
        if: steps.check.outputs.skip != '1'
        run: |
          git config user.name "tw-signal-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          # 只加存在的檔案:某個檔案還沒產生(例如當天沒有盤中觸發就沒有 bias_log.json)時,git add 會整步失敗
          for p in data/bear_scorecard.json data/corp_actions.json data/daytrade.json data/bias_log.json data/bars5m/ data/replay/ data/bars5m_top/ data/top_universe.json data/news.json; do
            if [ -e "$p" ]; then git add "$p"; else echo "略過不存在的 $p"; fi
          done
          if git diff --quiet --cached; then echo "沒有變動"; exit 0; fi
          git commit -m "利空回測成績單 $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            git rebase --abort 2>/dev/null; sleep 5
          done
          echo "push 失敗"; exit 1
