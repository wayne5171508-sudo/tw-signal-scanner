name: 永豐正式行情測試
on:
  workflow_dispatch:
jobs:
  quote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -U shioaji
      - name: 正式環境抓即時行情
        env:
          SJ_API_KEY: ${{ secrets.SJ_API_KEY }}
          SJ_SECRET_KEY: ${{ secrets.SJ_SECRET_KEY }}
        run: |
          set -o pipefail
          cat > q.py <<'EOF'
          import os
          import shioaji as sj
          api = sj.Shioaji()
          api.login(api_key=os.environ["SJ_API_KEY"], secret_key=os.environ["SJ_SECRET_KEY"])
          codes = ["2330", "2317", "2454"]
          snaps = api.snapshots([api.Contracts.Stocks[c] for c in codes])
          for s in snaps:
              print("RESULT", s.code, "成交價", s.close, "總量", s.total_volume, "總金額", s.total_amount)
          api.logout()
          EOF
          python -u q.py 2>&1 | sed -E 's/[A-Z][12][0-9]{8}/[已遮蔽]/g'
