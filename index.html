<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>爆量雷達</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --border:#262b36; --text:#e8eaed; --muted:#8b92a3;
    --up:#ff4d4f; --down:#2fbf71; --accent:#5b8cff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;padding:16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 4px}
  h2{font-size:15px;margin:24px 0 10px;color:var(--accent)}
  .meta{font-size:12px;color:var(--muted);margin-bottom:2px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:12px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:7px 6px;text-align:right;white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--muted);font-weight:500;border-bottom:1px solid var(--border)}
  tr+tr td{border-top:1px solid var(--border)}
  tbody tr{cursor:pointer}
  tbody tr:active{background:#1d2230}
  .up{color:var(--up)}
  .down{color:var(--down)}
  .flat{color:var(--muted)}
  .tablewrap{overflow-x:auto}
  .tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;background:#232838;color:var(--muted);margin-left:4px}
  .tag.warn{background:#3a2420;color:#ffb199}
  .note{font-size:12px;color:var(--muted);margin-top:8px}
  .err{color:#ffb199;font-size:13px}
  .stockcard{border-top:1px solid var(--border);padding:8px 0;font-size:13px}
  .stockcard:first-child{border-top:none}
  .stockcard .row1{display:flex;justify-content:space-between;font-weight:600}
  .stockcard .row2{font-size:12px;color:var(--muted);margin-top:2px}
  .badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:12px;font-weight:600}
  .badge.bull{background:#3d1f22;color:#ff8080}
  .badge.bear{background:#1f3d2b;color:#5fd98a}
  .badge.flat{background:#2a2e38;color:var(--muted)}
  a{color:var(--accent)}
  .refresh{float:right;font-size:12px;color:var(--accent);cursor:pointer;text-decoration:underline}

  /* 漲跌幅迷你長條 */
  .pctcell{display:flex;align-items:center;justify-content:flex-end;gap:6px}
  .pctbar{width:46px;height:8px;background:#1c2029;border-radius:4px;overflow:hidden;position:relative;flex-shrink:0}
  .pctbar i{position:absolute;top:0;bottom:0;display:block}
  .pctbar i.up{background:var(--up);right:50%}
  .pctbar i.down{background:var(--down);left:50%}

  /* 搜尋框 */
  .searchwrap{position:relative;margin-bottom:10px}
  .searchwrap input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:#11141b;color:var(--text);font-size:14px}
  .searchwrap input::placeholder{color:var(--muted)}
  .suggest{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden;z-index:5}
  .suggest div{padding:8px 12px;font-size:13px;cursor:pointer}
  .suggest div:hover,.suggest div.active{background:#232838}

  /* 個股分析卡 */
  .detail{border:1px solid var(--accent);background:#141a2b}
  .detail .dhead{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
  .detail .dname{font-size:17px;font-weight:700}
  .detail .dprice{font-size:26px;font-weight:700}
  .detail .dchg{font-size:14px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;font-size:12px}
  .grid4 div{background:#0f1320;border-radius:6px;padding:6px 8px}
  .grid4 b{display:block;font-size:13px;color:var(--text);font-weight:600}
  .gaugewrap{margin-top:14px}
  .gaugelabels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:2px}
  .sparkwrap{margin-top:14px}
  .close{float:right;color:var(--muted);cursor:pointer;font-size:13px}
  .chipbox{margin-top:12px;padding-top:10px;border-top:1px dashed var(--border);font-size:13px}
  .chipbox .none{color:var(--muted)}
</style>
</head>
<body>

<h1>爆量雷達 <span class="refresh" onclick="loadAll()">重新整理</span></h1>
<div class="meta" id="pageMeta">載入中...</div>

<div class="searchwrap">
  <input id="searchInput" type="text" placeholder="搜尋股票代碼或名稱,例如 2455 或 全新" autocomplete="off">
  <div class="suggest" id="suggestBox" style="display:none"></div>
</div>

<div class="card detail" id="detailCard" style="display:none"></div>

<h2>大盤</h2>
<div class="card tablewrap">
  <div id="indicesTable">載入中...</div>
  <div class="note" id="intradayNote"></div>
</div>

<h2>自選股即時報價</h2>
<div class="card tablewrap">
  <div id="watchlistTable">載入中...</div>
</div>

<h2>盤後籌碼訊號</h2>
<div class="card" id="chipSummary">載入中...</div>

<div class="card" id="chipRank" style="display:none">
  <div style="margin-bottom:6px;color:var(--muted);font-size:13px">三大法人買超排行</div>
  <div class="tablewrap" id="chipRankTable"></div>
</div>

<div class="card" id="chipWatch" style="display:none">
  <div style="margin-bottom:6px;color:var(--muted);font-size:13px">重點觀察 / 放量關注</div>
  <div id="chipWatchList"></div>
</div>

<div class="note" style="margin-top:20px">
  資料來源:大盤與自選股報價每約20分鐘由 GitHub Actions 直接向交易所/報價商 API 抓取一次,非逐秒即時;
  走勢小圖只畫「今天這個網頁開始記錄之後」抓到的幾個時間點,不是逐秒K線;
  籌碼訊號為每日收盤後計算一次。程式碼見
  <a href="https://github.com/wayne5171508-sudo/tw-signal-scanner" target="_blank">tw-signal-scanner</a>。
</div>

<script>
let INTRADAY = null, HISTORY = null, CHIP = null;

const PCT_CLASS = p => p > 0 ? 'up' : (p < 0 ? 'down' : 'flat');
const fmtPct = p => (p === null || p === undefined) ? '-' : (p > 0 ? '+' : '') + p.toFixed(2) + '%';
const fmtNum = n => (n === null || n === undefined) ? '-' : (Number.isInteger(n) ? n : n.toFixed(2));
const fmtChange = c => (c === null || c === undefined) ? '-' : (c > 0 ? '+' : '') + fmtNum(c);
const fmtTime = iso => {
  if(!iso) return '-';
  const d = new Date(iso);
  return d.toLocaleString('zh-TW', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false});
};
const fmtTimeShort = iso => {
  if(!iso) return '-';
  const d = new Date(iso);
  return d.toLocaleString('zh-TW', {hour:'2-digit', minute:'2-digit', hour12:false});
};

function pctBar(pct){
  if(pct === null || pct === undefined) return '<span class="pctbar"></span>';
  const mag = Math.min(Math.abs(pct), 10) / 10 * 50; // 最大視覺化到±10%
  const cls = pct >= 0 ? 'up' : 'down';
  return `<span class="pctbar"><i class="${cls}" style="width:${mag}%"></i></span>`;
}

// 從 HISTORY 取某代碼今天的價格序列(indices用code原樣,watchlist用4碼)
function seriesFor(code, isIndex){
  if(!HISTORY || !HISTORY.points || !HISTORY.points.length) return [];
  const key = isIndex ? 'idx' : 'wl';
  return HISTORY.points.map(p => p[key] ? p[key][code] : undefined).filter(v => v !== undefined && v !== null);
}

function sparklineSvg(series, w, h, color){
  if(!series || series.length < 2){
    return `<svg width="${w}" height="${h}"></svg>`;
  }
  const min = Math.min(...series), max = Math.max(...series);
  const range = (max - min) || 1;
  const step = w / (series.length - 1);
  const pts = series.map((v,i) => `${(i*step).toFixed(1)},${(h - ((v-min)/range)*h).toFixed(1)}`).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

function renderIndices(data){
  if(!data || !data.indices){
    document.getElementById('indicesTable').innerHTML = '<div class="err">暫無大盤資料</div>';
    return;
  }
  let rows = data.indices.map(q => {
    const series = seriesFor(q.code, true);
    const color = q.change > 0 ? 'var(--up)' : (q.change < 0 ? 'var(--down)' : 'var(--muted)');
    return `
    <tr onclick="openDetail('${q.code}', true)">
      <td>${q.name}</td>
      <td class="${PCT_CLASS(q.change)}">${fmtNum(q.last)}</td>
      <td class="${PCT_CLASS(q.change)}">${fmtChange(q.change)}</td>
      <td><div class="pctcell">${fmtPct(q.pct)}${pctBar(q.pct)}</div></td>
      <td>${sparklineSvg(series, 60, 22, color)}</td>
    </tr>`;
  }).join('');
  document.getElementById('indicesTable').innerHTML = `
    <table><thead><tr><th>指數</th><th>最新</th><th>漲跌</th><th>漲跌幅</th><th>今日走勢</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
  document.getElementById('intradayNote').textContent =
    `資料時間約 ${fmtTime(data.data_as_of)} · ${data.check_frequency_note || ''}`;
}

function renderWatchlist(data, filterText){
  if(!data || !data.watchlist_quotes){
    document.getElementById('watchlistTable').innerHTML = '<div class="err">暫無自選股資料</div>';
    return;
  }
  let list = [...data.watchlist_quotes];
  if(filterText){
    const f = filterText.trim().toLowerCase();
    list = list.filter(q => q.code.includes(f) || (q.name && q.name.toLowerCase().includes(f)));
  }
  list.sort((a,b) => (b.pct ?? -999) - (a.pct ?? -999));
  if(!list.length){
    document.getElementById('watchlistTable').innerHTML = '<div class="note">找不到符合的股票</div>';
    return;
  }
  let rows = list.map(q => {
    const nearLimit = q.pct !== null && q.pct !== undefined && Math.abs(q.pct) >= 9.5;
    const series = seriesFor(q.code, false);
    const color = q.change > 0 ? 'var(--up)' : (q.change < 0 ? 'var(--down)' : 'var(--muted)');
    return `
    <tr onclick="openDetail('${q.code}', false)">
      <td>${q.code} ${q.name}${nearLimit ? '<span class="tag warn">近停板</span>' : ''}</td>
      <td class="${PCT_CLASS(q.change)}">${fmtNum(q.last)}</td>
      <td><div class="pctcell">${fmtPct(q.pct)}${pctBar(q.pct)}</div></td>
      <td>${sparklineSvg(series, 60, 22, color)}</td>
    </tr>`;
  }).join('');
  document.getElementById('watchlistTable').innerHTML = `
    <table><thead><tr><th>代碼/名稱</th><th>成交</th><th>漲跌幅</th><th>今日走勢</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

function findChipEntry(code){
  if(!CHIP) return null;
  const pools = [...(CHIP.focus_stocks||[]), ...(CHIP.surge_watch||[])];
  const hit = pools.find(s => s.code === code);
  if(hit) return {type:'watch', data:hit};
  const rank = (CHIP.institutional_buy_rank_top8||[]).findIndex(s => s.code === code);
  if(rank >= 0) return {type:'rank', data:CHIP.institutional_buy_rank_top8[rank], rank: rank+1};
  return null;
}

function renderChipBox(code){
  const entry = findChipEntry(code);
  if(!entry){
    return `<div class="chipbox"><span class="none">今日籌碼資料沒有特別標記這檔(不代表沒表現,只是沒進入篩選名單)</span></div>`;
  }
  if(entry.type === 'rank'){
    return `<div class="chipbox">三大法人買超排行第 <b>${entry.rank}</b> 名,買超 <b>${fmtNum(entry.data.net_buy_lots)}</b> 張</div>`;
  }
  const s = entry.data;
  return `<div class="chipbox">
    ${s.signal_status || ''} · 技術分 <b>${fmtNum(s.tech_score)}</b>(${s.tag || '-'})
    ${s.sector_cluster && s.sector_cluster !== '無族群效應' ? ' · ' + s.sector_cluster : ''}
    ${s.limit_up_locked ? '<span class="tag warn">漲停鎖死</span>' : ''}
    ${s.consecutive_buy_days ? ` · 連買${s.consecutive_buy_days}天` : ''}
    ${s.cost_breakeven_tag && s.cost_breakeven_tag !== 'normal' ? ' · ' + s.cost_breakeven_tag : ''}
    ${s.amplitude_tag ? ' · 振幅:' + s.amplitude_tag : ''}
    ${s.gap_tag ? ' · 開盤缺口:' + s.gap_tag : ''}
  </div>`;
}

function rangeGauge(q){
  const low = q.low, high = q.high, last = q.last, prev = q.prev_close;
  if(low === null || high === null || last === null || low === undefined || high === undefined){
    return '<div class="note">今日高低資料不足,無法畫區間圖</div>';
  }
  const lo = Math.min(low, prev ?? low), hi = Math.max(high, prev ?? high);
  const range = (hi - lo) || 1;
  const pos = v => Math.max(0, Math.min(100, ((v - lo) / range) * 100));
  const lastPos = pos(last);
  const prevPos = prev !== null && prev !== undefined ? pos(prev) : null;
  const color = last >= (prev ?? last) ? 'var(--up)' : 'var(--down)';
  return `
    <div class="gaugewrap">
      <div style="position:relative;height:10px;background:#1c2029;border-radius:5px">
        <div style="position:absolute;left:0;top:0;bottom:0;width:${lastPos}%;background:${color};opacity:0.35;border-radius:5px"></div>
        ${prevPos !== null ? `<div style="position:absolute;left:${prevPos}%;top:-3px;bottom:-3px;width:2px;background:var(--muted)"></div>` : ''}
        <div style="position:absolute;left:calc(${lastPos}% - 5px);top:-3px;width:10px;height:10px;border-radius:50%;background:${color};border:2px solid var(--card)"></div>
      </div>
      <div class="gaugelabels"><span>低 ${fmtNum(low)}</span><span>昨收 ${fmtNum(prev)}</span><span>高 ${fmtNum(high)}</span></div>
    </div>`;
}

function openDetail(code, isIndex){
  const pool = isIndex ? (INTRADAY && INTRADAY.indices) : (INTRADAY && INTRADAY.watchlist_quotes);
  if(!pool) return;
  const q = pool.find(x => x.code === code);
  if(!q) return;

  const series = seriesFor(code, isIndex);
  const color = q.change > 0 ? 'var(--up)' : (q.change < 0 ? 'var(--down)' : 'var(--muted)');
  const distUpper = (q.upper_limit && q.last) ? (((q.upper_limit - q.last) / q.last) * 100).toFixed(2) : null;
  const distLower = (q.lower_limit && q.last) ? (((q.last - q.lower_limit) / q.last) * 100).toFixed(2) : null;

  document.getElementById('detailCard').innerHTML = `
    <span class="close" onclick="closeDetail()">收合 ✕</span>
    <div class="dhead">
      <div><span class="dname">${q.code !== q.name ? q.code + ' ' : ''}${q.name}</span></div>
      <div style="text-align:right">
        <span class="dprice ${PCT_CLASS(q.change)}">${fmtNum(q.last)}</span>
        <span class="dchg ${PCT_CLASS(q.change)}">${fmtChange(q.change)} (${fmtPct(q.pct)})</span>
      </div>
    </div>
    <div class="grid4">
      <div>開盤<b>${fmtNum(q.open)}</b></div>
      <div>最高<b>${fmtNum(q.high)}</b></div>
      <div>最低<b>${fmtNum(q.low)}</b></div>
      <div>昨收<b>${fmtNum(q.prev_close)}</b></div>
    </div>
    ${!isIndex ? `
    <div class="grid4">
      <div>漲停價<b>${fmtNum(q.upper_limit)}</b></div>
      <div>距漲停<b>${distUpper !== null ? distUpper + '%' : '-'}</b></div>
      <div>跌停價<b>${fmtNum(q.lower_limit)}</b></div>
      <div>距跌停<b>${distLower !== null ? distLower + '%' : '-'}</b></div>
    </div>` : ''}
    ${rangeGauge(q)}
    <div class="sparkwrap">
      <div class="meta">今日走勢(從網頁開始記錄算起)</div>
      ${sparklineSvg(series, 280, 50, color)}
    </div>
    ${!isIndex ? renderChipBox(code) : ''}
  `;
  document.getElementById('detailCard').style.display = '';
  document.getElementById('detailCard').scrollIntoView({behavior:'smooth', block:'start'});
}

function closeDetail(){
  document.getElementById('detailCard').style.display = 'none';
}

function renderChip(data){
  const summaryEl = document.getElementById('chipSummary');
  if(!data){
    summaryEl.innerHTML = '<div class="err">暫無籌碼資料</div>';
    return;
  }
  if(data.market_status !== 'OK'){
    summaryEl.innerHTML = `<div class="meta">${data.date || ''}</div>
      <div class="note">今日籌碼資料尚未就緒(排程可能還沒跑完,晚點再看)。</div>`;
    return;
  }
  const regime = data.market_regime || '-';
  const badgeClass = regime === '多頭' ? 'bull' : (regime === '空頭' ? 'bear' : 'flat');
  summaryEl.innerHTML = `
    <div class="meta">${data.date}</div>
    <span class="badge ${badgeClass}">大盤環境:${regime}</span>
    <span class="tag">加權指數 ${fmtPct(data.taiex_change_pct)}</span>`;

  if(data.institutional_buy_rank_top8 && data.institutional_buy_rank_top8.length){
    document.getElementById('chipRank').style.display = '';
    const rows = data.institutional_buy_rank_top8.map(r => `
      <tr onclick="searchAndOpen('${r.code}')" style="cursor:pointer"><td>${r.code} ${r.name}</td><td>${fmtNum(r.net_buy_lots)} 張</td></tr>`).join('');
    document.getElementById('chipRankTable').innerHTML = `
      <table><thead><tr><th>個股</th><th>買超張數</th></tr></thead><tbody>${rows}</tbody></table>`;
  }

  const watch = [...(data.focus_stocks||[]), ...(data.surge_watch||[])];
  if(watch.length){
    document.getElementById('chipWatch').style.display = '';
    document.getElementById('chipWatchList').innerHTML = watch.map(s => `
      <div class="stockcard" onclick="searchAndOpen('${s.code}')" style="cursor:pointer">
        <div class="row1"><span>${s.code} ${s.name}</span><span class="${PCT_CLASS(s.change)}">${fmtChange(s.change)}</span></div>
        <div class="row2">
          ${s.signal_status || ''} · 技術分 ${fmtNum(s.tech_score)}(${s.tag || '-'})
          ${s.sector_cluster && s.sector_cluster !== '無族群效應' ? ' · ' + s.sector_cluster : ''}
          ${s.limit_up_locked ? '<span class="tag warn">漲停鎖死</span>' : ''}
          ${s.consecutive_buy_days ? ` · 連買${s.consecutive_buy_days}天` : ''}
        </div>
      </div>`).join('');
  }
}

function searchAndOpen(code){
  if(INTRADAY && INTRADAY.watchlist_quotes && INTRADAY.watchlist_quotes.find(q => q.code === code)){
    openDetail(code, false);
  }
}

// ---- 搜尋框 ----
function setupSearch(){
  const input = document.getElementById('searchInput');
  const box = document.getElementById('suggestBox');

  function matches(q){
    if(!INTRADAY || !INTRADAY.watchlist_quotes) return [];
    const f = q.trim().toLowerCase();
    if(!f) return [];
    return INTRADAY.watchlist_quotes.filter(s => s.code.includes(f) || (s.name && s.name.toLowerCase().includes(f))).slice(0, 8);
  }

  input.addEventListener('input', () => {
    const list = matches(input.value);
    renderWatchlist(INTRADAY, input.value);
    if(!list.length){ box.style.display = 'none'; return; }
    box.innerHTML = list.map(s => `<div onclick="pickSuggest('${s.code}')">${s.code} ${s.name} <span style="color:var(--muted);float:right">${fmtNum(s.last)} ${fmtPct(s.pct)}</span></div>`).join('');
    box.style.display = '';
  });
  input.addEventListener('keydown', e => {
    if(e.key === 'Enter'){
      const list = matches(input.value);
      if(list.length) pickSuggest(list[0].code);
    }
  });
  document.addEventListener('click', e => {
    if(e.target !== input) box.style.display = 'none';
  });
}

function pickSuggest(code){
  document.getElementById('suggestBox').style.display = 'none';
  document.getElementById('searchInput').value = '';
  renderWatchlist(INTRADAY, '');
  openDetail(code, false);
}

async function loadAll(){
  document.getElementById('pageMeta').textContent = '載入中...';
  let chip = null, intraday = null, history = null, errs = [];
  try{
    const r = await fetch('data/latest.json', {cache:'no-store'});
    chip = await r.json();
  }catch(e){ errs.push('籌碼資料讀取失敗'); }
  try{
    const r = await fetch('data/intraday_latest.json', {cache:'no-store'});
    intraday = await r.json();
  }catch(e){ errs.push('即時報價讀取失敗'); }
  try{
    const r = await fetch('data/intraday_history.json', {cache:'no-store'});
    if(r.ok) history = await r.json();
  }catch(e){ /* 走勢圖資料非必要,失敗就不畫 */ }

  CHIP = chip; INTRADAY = intraday; HISTORY = history;

  renderIndices(intraday);
  renderWatchlist(intraday, document.getElementById('searchInput').value);
  renderChip(chip);

  document.getElementById('pageMeta').textContent =
    `頁面載入時間 ${new Date().toLocaleString('zh-TW',{hour12:false})}` +
    (errs.length ? ' · ' + errs.join('、') : '');
}

setupSearch();
loadAll();
</script>
</body>
</html>
